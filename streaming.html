<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahesh&#x27;s Music Streaming List</title>
<meta name="description" content="Curated listening lists with ragas and notes, saved as Spotify playlists.">
<style>
:root {
  --bg: #faf7f2; --surface: #ffffff; --surface-2: #f4efe7; --ink: #2a2420; --muted: #6f655c;
  --line: #e7dfd4; --accent: #9a3b1c; --accent-ink: #ffffff; --accent-soft: #f5e6da; --green: #1d7a46;
  --shadow: 0 1px 2px rgb(60 40 20 / .06), 0 4px 16px rgb(60 40 20 / .06);
  --radius: 10px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161311; --surface: #201c19; --surface-2: #2a2521; --ink: #efe8df; --muted: #a89d91;
    --line: #3a332d; --accent: #e3956a; --accent-ink: #1b1411; --accent-soft: #3b2a20; --green: #4cc27f;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161311; --surface: #201c19; --surface-2: #2a2521; --ink: #efe8df; --muted: #a89d91;
  --line: #3a332d; --accent: #e3956a; --accent-ink: #1b1411; --accent-soft: #3b2a20; --green: #4cc27f;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
body.has-player { padding-bottom: 104px; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-top: 18px; padding-bottom: 18px; flex-wrap: wrap; }
h1 { font: 600 26px/1.15 var(--serif); margin: 0; letter-spacing: -.01em; }
.stats { color: var(--muted); font-size: 13px; }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.icon-btn:hover { background: var(--surface-2); }
.sitenav { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.sitenav a { padding: 6px 14px; text-decoration: none; color: var(--muted); font-size: 14px; }
.sitenav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

.lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; padding: 22px 0 40px; }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); text-align: left; padding: 0; display: flex; flex-direction: column; transition: transform .12s ease; }
.lcard:hover { transform: translateY(-2px); }
.lcard .body { padding: 10px 12px 12px; }
.lcard .t { font: 600 17px/1.25 var(--serif); }
.lcard .m { color: var(--muted); font-size: 13px; }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; aspect-ratio: 1; background: var(--surface-2); }
.mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }

.back { border: 0; background: none; color: var(--accent); padding: 16px 0 0; font-size: 14px; }
.hero { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: end; padding: 14px 0 18px; }
.hero .mosaic { border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
.hero .kicker { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.hero h2 { font: 600 32px/1.1 var(--serif); margin: 4px 0 8px; }
.hero p { margin: 0 0 10px; max-width: 70ch; }
.hero .m { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; text-decoration: none; color: var(--ink); font-size: 14px; }
.btn.spotify { background: var(--green); border-color: var(--green); color: #fff; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 0 10px; }
.search { flex: 1 1 260px; position: relative; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
select { border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 8px 12px; max-width: 200px; }
.result-meta { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.linkish { border: 0; background: none; color: var(--accent); padding: 0 4px; font-size: 13px; }

.tracks { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.tracks > li + li { border-top: 1px solid var(--line); }
.trow { display: grid; grid-template-columns: 28px 52px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px; }
.trow.now { background: var(--accent-soft); }
.num { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; padding-top: 14px; font-size: 13px; }
.trow img, .trow .ph { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; background: var(--surface-2); display: block; }
.tt { font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; }
.note { font-size: 14px; margin-top: 4px; max-width: 75ch; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); border: 0; text-decoration: none; }
button.tag:hover { background: var(--accent-soft); }
.tag.raga { background: var(--accent-soft); }
a.tag.arch { background: none; border: 1px solid var(--line); color: var(--accent); }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 4px; }
.play { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; color: var(--green); }
.play:hover, .trow.now .play { background: var(--green); color: #fff; border-color: var(--green); }

.pager { display: flex; justify-content: center; gap: 6px; margin: 20px 0 40px; flex-wrap: wrap; }
.pager button { min-width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 10px; }
.pager button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pager button:disabled { opacity: .4; cursor: default; }
.empty { padding: 40px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

.player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgb(0 0 0 / .08); z-index: 10; }
.player .wrap { display: flex; align-items: center; gap: 10px; padding-top: 8px; padding-bottom: 8px; }
.player iframe { flex: 1; min-width: 0; height: 80px; border: 0; border-radius: 12px; }

@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; }
  .hero .mosaic { max-width: 220px; }
  .hero h2 { font-size: 26px; }
  .trow { grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; }
  .trow .num { display: none; }
  .trow img, .trow .ph { width: 44px; height: 44px; }
  h1 { font-size: 22px; }
  select { max-width: none; flex: 1 1 40%; }
}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mmss = s => s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : "";
const hm = s => { const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h} hr ${m} min` : `${m} min`; };
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const spUrl = (kind, id) => `https://open.spotify.com/${kind}/${id}`;

// "Ragamala: A, B" -> [A, B]; "Todi → Khamaj" -> [Todi, Khamaj]; "Khamaj (with excursions)" -> [Khamaj]
function ragas(r) {
  return String(r || "").replace(/^ragamala:\s*/i, "").replace(/\(.*?\)/g, "").split(/,|→|->/).map(s => s.trim()).filter(Boolean);
}
const splitPeople = s => String(s || "").split(/,\s*/).map(x => x.trim()).filter(Boolean);
const decade = y => y ? `${Math.floor(y / 10) * 10}s` : "";

for (const L of DATA.lists) {
  L.tracks.forEach((t, i) => {
    t.n = i + 1;
    t.ragaList = ragas(t.raga);
    t.singerList = splitPeople(t.singers);
    t.composerList = splitPeople(t.composer);
    t.decade = decade(t.year);
    t.dur = t.sp?.duration || 0;
    t.hay = norm([t.title, t.film, t.year, t.singers, t.composer, t.raga, t.note, t.sp?.name].join(" "));
  });
  L.dur = L.tracks.reduce((a, t) => a + t.dur, 0);
  const ys = L.tracks.map(t => t.year).filter(Boolean);
  L.span = ys.length ? `${Math.min(...ys)}–${Math.max(...ys)}` : "";
  L.covers = [...new Set(L.tracks.map(t => t.sp?.image).filter(Boolean))].slice(0, 4);
}
$("#stats").textContent = `${DATA.lists.length} list${DATA.lists.length === 1 ? "" : "s"} · ${DATA.lists.reduce((a, L) => a + L.tracks.length, 0)} tracks`;

const FILTERS = [
  { key: "raga", label: "All ragas", get: t => t.ragaList },
  { key: "composer", label: "All composers", get: t => t.composerList },
  { key: "singer", label: "All singers", get: t => t.singerList },
  { key: "decade", label: "All decades", get: t => [t.decade] },
];

// ---------- state <-> hash ----------
let S = {};
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  S = { list: p.get("list") || "", q: p.get("q") || "", page: Math.max(1, +p.get("p") || 1), f: {} };
  for (const f of FILTERS) if (p.get(f.key)) S.f[f.key] = p.get(f.key);
  if (DATA.lists.length === 1 && !S.list) S.list = DATA.lists[0].id;
}
function writeHash() {
  const p = new URLSearchParams();
  if (S.list && DATA.lists.length > 1) p.set("list", S.list);
  if (S.q) p.set("q", S.q);
  for (const [k, v] of Object.entries(S.f)) p.set(k, v);
  if (S.page > 1) p.set("p", S.page);
  const h = "#" + p.toString();
  if (h !== location.hash) history.replaceState(null, "", h === "#" ? location.pathname : h);
}
function set(patch) { Object.assign(S, patch); writeHash(); render(); }

const mosaic = L => `<div class="mosaic">${(L.covers.length >= 4 ? L.covers : L.covers.slice(0, 1)).map((u, i, a) =>
  `<img src="${esc(u)}" alt="" loading="lazy"${a.length === 1 ? ' style="grid-column:1/3;grid-row:1/3"' : ""}>`).join("")}</div>`;

function renderHome() {
  $("#main").innerHTML = `<div class="lists">${DATA.lists.map(L => `
    <button class="lcard" data-list="${esc(L.id)}">${mosaic(L)}
      <div class="body"><div class="t">${esc(L.title)}</div>
      <div class="m">${L.tracks.length} songs · ${esc(L.span)} · ${hm(L.dur)}</div></div>
    </button>`).join("")}</div>`;
}

function renderList(L) {
  const q = norm(S.q.trim());
  const rows = L.tracks.filter(t => (!q || q.split(/\s+/).every(w => t.hay.includes(w))) &&
    FILTERS.every(f => !S.f[f.key] || f.get(t).includes(S.f[f.key])));
  const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
  S.page = Math.min(S.page, pages);
  const shown = rows.slice((S.page - 1) * PER_PAGE, S.page * PER_PAGE);
  const opts = f => {
    const c = new Map();
    for (const t of L.tracks) for (const v of f.get(t)) if (v) c.set(v, (c.get(v) || 0) + 1);
    const vals = [...c].sort((a, b) => f.key === "decade" ? a[0].localeCompare(b[0]) : b[1] - a[1] || a[0].localeCompare(b[0]));
    return `<select data-filter="${f.key}" aria-label="${esc(f.label)}"><option value="">${esc(f.label)}</option>${
      vals.map(([v, n]) => `<option value="${esc(v)}"${S.f[f.key] === v ? " selected" : ""}>${esc(v)} (${n})</option>`).join("")}</select>`;
  };
  const filtered = S.q || Object.keys(S.f).length;
  const arch = r => DATA.archive[r] ? ` <a class="tag arch" href="index.html#view=tracks&raga=${encodeURIComponent(r)}" title="Recordings of ${esc(r)} in the archive">archive ${DATA.archive[r]}</a>` : "";
  $("#main").innerHTML = `
    ${DATA.lists.length > 1 ? `<button class="back" data-home>← All lists</button>` : ""}
    <section class="hero">${mosaic(L)}
      <div><div class="kicker">Streaming list</div>
        <h2>${esc(L.title)}</h2>
        <p>${esc(L.description || "")}</p>
        <div class="m">${L.tracks.length} songs · ${esc(L.span)} · ${hm(L.dur)}${L.created ? ` · made ${esc(L.created)}` : ""}</div>
        <div class="actions">
          ${L.spotify_playlist ? `<a class="btn spotify" href="${spUrl("playlist", L.spotify_playlist)}" target="_blank" rel="noopener">Open in Spotify</a>
          <button class="btn" data-play-list>Play here</button>` : ""}
        </div></div>
    </section>
    <div class="toolbar">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search songs, films, singers, ragas, notes…" value="${esc(S.q)}" autocomplete="off" aria-label="Search"></label>
      ${FILTERS.map(opts).join("")}
    </div>
    <div class="result-meta">${rows.length} of ${L.tracks.length} songs${filtered ? ` <button class="linkish" data-clear>Clear</button>` : ""}</div>
    ${shown.length ? `<ol class="tracks">${shown.map(t => `
      <li class="trow${NOW === t.spotify ? " now" : ""}">
        <div class="num">${t.n}</div>
        ${t.sp?.image ? `<img src="${esc(t.sp.image)}" alt="" loading="lazy">` : `<div class="ph"></div>`}
        <div>
          <div class="tt">${esc(t.title)}</div>
          <div class="sub">${esc(t.film)}${t.year ? ` (${t.year})` : ""} · ${esc(t.singers)} · music ${esc(t.composer)}</div>
          ${t.note ? `<div class="note">${esc(t.note)}</div>` : ""}
          <div class="tags">${t.ragaList.map(r => `<button class="tag raga" data-f="raga" data-v="${esc(r)}">${esc(r)}</button>${arch(r)}`).join("")}
            ${/ragamala/i.test(t.raga) ? `<span class="tag">ragamala</span>` : ""}</div>
        </div>
        <div class="right">
          <button class="play" data-play="${esc(t.spotify)}" aria-label="Play ${esc(t.title)}" title="Play">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></button>
          <span>${mmss(t.dur)}</span>
          <a href="${spUrl("track", t.spotify)}" target="_blank" rel="noopener" title="Open in Spotify">Spotify ↗</a>
        </div>
      </li>`).join("")}</ol>` : `<div class="empty">No songs match.</div>`}
    ${pages > 1 ? `<nav class="pager" aria-label="Pages">
      <button data-page="${S.page - 1}" ${S.page === 1 ? "disabled" : ""} aria-label="Previous page">‹</button>
      ${Array.from({ length: pages }, (_, i) => `<button data-page="${i + 1}"${i + 1 === S.page ? ' aria-current="page"' : ""}>${i + 1}</button>`).join("")}
      <button data-page="${S.page + 1}" ${S.page === pages ? "disabled" : ""} aria-label="Next page">›</button></nav>` : ""}`;
}

function render() {
  const L = DATA.lists.find(l => l.id === S.list);
  document.title = L ? `${L.title} · ${DATA.title}` : DATA.title;
  L ? renderList(L) : renderHome();
}

let NOW = "";
function play(kind, id) {
  NOW = kind === "track" ? id : "";
  $("#embed").src = `https://open.spotify.com/embed/${kind}/${id}?utm_source=generator`;
  $("#player").hidden = false;
  document.body.classList.add("has-player");
  document.querySelectorAll(".trow").forEach(r => r.classList.toggle("now", !!NOW && r.querySelector(`[data-play="${NOW}"]`)));
}

document.addEventListener("click", e => {
  const b = e.target.closest("button, a");
  if (!b) return;
  if (b.dataset.list) set({ list: b.dataset.list, page: 1, q: "", f: {} });
  else if (b.hasAttribute("data-home")) set({ list: "", page: 1, q: "", f: {} });
  else if (b.dataset.page) { set({ page: +b.dataset.page }); $("#main").scrollIntoView({ block: "start" }); }
  else if (b.dataset.f) set({ f: { ...S.f, [b.dataset.f]: b.dataset.v }, page: 1 });
  else if (b.hasAttribute("data-clear")) set({ q: "", f: {}, page: 1 });
  else if (b.dataset.play) play("track", b.dataset.play);
  else if (b.hasAttribute("data-play-list")) play("playlist", DATA.lists.find(l => l.id === S.list).spotify_playlist);
});
document.addEventListener("change", e => {
  const k = e.target.dataset.filter;
  if (!k) return;
  const f = { ...S.f };
  e.target.value ? f[k] = e.target.value : delete f[k];
  set({ f, page: 1 });
});
let qt;
document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  clearTimeout(qt);
  qt = setTimeout(() => {
    const pos = e.target.selectionStart;
    set({ q: e.target.value, page: 1 });
    const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos);
  }, 150);
});
$("#closePlayer").onclick = () => { $("#embed").src = "about:blank"; $("#player").hidden = true; NOW = ""; document.body.classList.remove("has-player"); render(); };

// theme (shared key with the archive page)
const root = document.documentElement;
try { const th = localStorage.getItem("catalog-theme"); if (th) root.dataset.theme = th; } catch {}
$("#themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("catalog-theme", root.dataset.theme); } catch {}
};

window.addEventListener("hashchange", () => { readHash(); render(); });
readHash(); render();
</script>
</body>
</html>
