<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahesh&#x27;s Music Catalog</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="description" content="Mahesh's Music Catalog: Hindustani, Carnatic and Fusion recordings, each marked In Archive or streaming only, with Spotify and YouTube links and raga notes.">
<style>
:root {
  --bg: #faf7f2; --surface: #ffffff; --surface-2: #f4efe7; --ink: #2a2420; --muted: #6f655c;
  --line: #e7dfd4; --accent: #9a3b1c; --accent-ink: #ffffff; --accent-soft: #f5e6da; --warn: #8a5a00; --warn-soft: #fbefd2;
  --shadow: 0 1px 2px rgb(60 40 20 / .06), 0 4px 16px rgb(60 40 20 / .06);
  --radius: 10px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161311; --surface: #201c19; --surface-2: #2a2521; --ink: #efe8df; --muted: #a89d91;
    --line: #3a332d; --accent: #e3956a; --accent-ink: #1b1411; --accent-soft: #3b2a20; --warn: #f0c46a; --warn-soft: #3a2f17;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161311; --surface: #201c19; --surface-2: #2a2521; --ink: #efe8df; --muted: #a89d91;
  --line: #3a332d; --accent: #e3956a; --accent-ink: #1b1411; --accent-soft: #3b2a20; --warn: #f0c46a; --warn-soft: #3a2f17;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
body.has-player { padding-bottom: 84px; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }

header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-top: 18px; padding-bottom: 18px; flex-wrap: wrap; }
h1 { font: 600 26px/1.15 var(--serif); margin: 0; letter-spacing: -.01em; }
.stats { color: var(--muted); font-size: 13px; }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.icon-btn:hover { background: var(--surface-2); }
.sitenav { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.sitenav a { padding: 6px 14px; text-decoration: none; color: var(--muted); font-size: 14px; }
.sitenav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 16px 0 8px; }
.search { flex: 1 1 280px; position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
select.sort { border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 8px 12px; }
#filterToggle { display: none; }

.active-filters { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; padding-bottom: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
.chip.on { background: var(--accent-soft); border-color: transparent; }
.chip button { border: 0; background: none; padding: 0; color: var(--muted); font-size: 15px; line-height: 1; }
.linkish { border: 0; background: none; color: var(--accent); padding: 3px 4px; font-size: 13px; }

.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; padding-bottom: 40px; }
aside.facets { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); overflow: auto; padding-right: 4px; }
.facet { border-bottom: 1px solid var(--line); padding: 10px 0; }
.facet summary { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.facet summary::-webkit-details-marker { display: none; }
.facet summary::after { content: "+"; }
.facet[open] summary::after { content: "–"; }
.facet ul { list-style: none; margin: 8px 0 0; padding: 0; }
.facet li button { width: 100%; display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: none; padding: 4px 8px; border-radius: 6px; font-size: 14px; }
.facet li button:hover { background: var(--surface-2); }
.facet li button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.facet li button[aria-pressed="true"] .ct { color: inherit; }
.facet li button:disabled { opacity: .4; cursor: default; }
.facet .ct { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.facet .more { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 4px 8px; }

.result-meta { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; text-align: left; padding: 0; transition: transform .12s ease; }
.card:hover { transform: translateY(-2px); }
.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--surface-2); }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; }
.card .t { font: 600 16px/1.25 var(--serif); }
.card .a { color: var(--muted); font-size: 13px; }
.card .m { color: var(--muted); font-size: 12px; margin-top: 4px; }
.genre-group + .genre-group { margin-top: 30px; }
.genre-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.genre-link { border: 0; background: none; padding: 0; font: 600 20px/1.2 var(--serif); color: var(--ink); text-align: left; }
.genre-link:hover { color: var(--accent); }
.genre-h span { color: var(--muted); font-size: 13px; font-weight: 400; font-family: var(--sans); }
.ph { display: grid; place-items: center; aspect-ratio: 1; width: 100%; background: linear-gradient(135deg, var(--accent-soft), var(--surface-2)); color: var(--accent); font: 600 28px var(--serif); }
.trow .ph { width: 44px; height: 44px; border-radius: 6px; font-size: 14px; }
.ph.cover { border-radius: 10px; font-size: 64px; }
.badge { align-self: flex-start; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin-bottom: 4px; letter-spacing: .02em; }
.badge.own { background: var(--accent); color: var(--accent-ink); }
.badge.not { border: 1px solid var(--line); color: var(--muted); }
.badge.stream { background: #1d7a46; color: #fff; }
.card.not-owned img, .card.not-owned .ph { opacity: .82; }
.about { max-width: 70ch; margin: 0 0 14px; }
.spnote { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
.card .match { color: var(--accent); font-size: 12px; font-weight: 600; margin-top: 2px; }

.tracks { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.tracks > li + li { border-top: 1px solid var(--line); }
.trow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; }
.trow img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; }
.trow .main { min-width: 0; }
.trow .tt { font-weight: 600; }
.trow .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .right { display: flex; align-items: center; gap: 10px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); border: 0; }
button.tag:hover { background: var(--accent-soft); }
.tag.raga { background: var(--accent-soft); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.expand { border: 0; background: none; color: var(--muted); padding: 4px; }
.expand[aria-expanded="true"] svg { transform: rotate(180deg); }
.tnotes { padding: 0 12px 14px 68px; color: var(--ink); font-size: 14px; }
.tnotes dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 8px 0 0; font-size: 13px; }
.tnotes dt { color: var(--muted); }
.tnotes dd { margin: 0; }
.play { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; color: var(--accent); flex: none; }
.play:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.play.playing { background: var(--accent); color: var(--accent-ink); }

.pager { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 22px; flex-wrap: wrap; }
.pager button { min-width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 10px; }
.pager button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pager button:disabled { opacity: .4; cursor: default; }
.empty { padding: 40px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

dialog { border: 0; padding: 0; border-radius: 14px; width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--bg); color: var(--ink); box-shadow: 0 20px 60px rgb(0 0 0 / .35); }
dialog::backdrop { background: rgb(20 14 10 / .55); }
.dlg-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; padding: 10px; pointer-events: none; }
.dlg-head button { pointer-events: auto; }
.detail { padding: 0 28px 28px; margin-top: -40px; }
.hero { display: grid; grid-template-columns: 280px 1fr; gap: 26px; align-items: start; }
.hero img.cover { width: 100%; border-radius: 10px; box-shadow: var(--shadow); display: block; }
.extras { display: flex; gap: 8px; margin-top: 8px; }
.extras a { display: block; width: 64px; }
.extras img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; }
.extras span { display: block; font-size: 11px; color: var(--muted); line-height: 1.2; margin-top: 2px; }
.detail h2 { font: 600 30px/1.15 var(--serif); margin: 4px 0 4px; }
.detail .by { color: var(--muted); font-size: 16px; margin-bottom: 14px; }
.meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; margin: 0 0 14px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; text-decoration: none; color: var(--ink); font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.detail h3 { font: 600 19px/1.3 var(--serif); margin: 28px 0 10px; }
.dtracks { list-style: none; padding: 0; margin: 0; counter-reset: none; }
.dtracks li { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.dtracks .num { color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 4px; text-align: right; }
.dtracks .tt { font-weight: 600; }
.dtracks .tn { font-size: 14px; margin-top: 4px; }
.dtracks .dur { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.liner { font-size: 15px; max-width: 72ch; }
.liner h2 { font: 600 17px/1.3 var(--serif); margin: 22px 0 6px; }
.liner table { border-collapse: collapse; font-size: 13px; margin: 8px 0; display: block; overflow-x: auto; }
.liner th, .liner td { border-bottom: 1px solid var(--line); padding: 5px 10px 5px 0; text-align: left; vertical-align: top; }
.liner th { color: var(--muted); font-weight: 600; }
.liner ul { padding-left: 20px; }

.player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgb(0 0 0 / .08); z-index: 10; }
.player .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.player img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }
.player .np { min-width: 0; flex: 0 1 280px; }
.player .np b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.player .np span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player audio { flex: 1; min-width: 0; height: 40px; }
.player iframe { flex: 1; min-width: 0; height: 80px; border: 0; border-radius: 12px; }
body.has-player.sp-mode { padding-bottom: 104px; }
.slinks { display: inline-flex; gap: 4px; align-items: center; }
.slink { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); text-decoration: none; }
.slink:hover { border-color: currentColor; }
.slink svg { width: 14px; height: 14px; display: block; }
.slink.sp { color: #1db954; } .slink.ytm, .slink.ytv { color: #e62117; }
.btn.ytm { background: #e62117; border-color: #e62117; color: #fff; }
.home-link { color: var(--muted); font-size: 13px; text-decoration: none; }
.home-link:hover { color: var(--accent); }
.rinfo { margin-top: 6px; font-size: 13px; }
.rinfo summary { cursor: pointer; color: var(--accent); width: max-content; }
.rinfo dl, .rbox dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 6px 0 0; }
.rinfo dt, .rbox dt { color: var(--muted); } .rinfo dd, .rbox dd { margin: 0; }
.rsrc { color: var(--muted); font-size: 11px; margin-top: 4px; }
.swara { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
.impressions { font-size: 15px; max-width: 72ch; border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; }
.btn.spotify { background: #1d7a46; border-color: #1d7a46; color: #fff; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  #filterToggle { display: inline-flex; }
  aside.facets { display: none; position: static; max-height: none; }
  aside.facets.open { display: block; }
  .hero { grid-template-columns: 1fr; }
  .hero img.cover { max-width: 320px; }
  .detail { padding: 0 16px 20px; }
  .tnotes { padding-left: 12px; }
}
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .trow { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; }
  .trow img { width: 40px; height: 40px; }
  .player .np { flex-basis: 120px; }
  .player img { display: none; }
  h1 { font-size: 22px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1 id="siteTitle">Mahesh&#x27;s Music Catalog</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="top-actions">
      <a class="home-link" href="/music/">electronut.in/music</a>
      <button class="icon-btn" id="themeBtn" title="Toggle light/dark" aria-label="Toggle light or dark theme">◐</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search ragas, artists, titles, notes…" autocomplete="off" aria-label="Search">
    </label>
    <div class="seg" role="group" aria-label="View">
      <button data-view="albums" aria-pressed="true">Albums</button>
      <button data-view="tracks" aria-pressed="false">Tracks</button>
    </div>
    <select class="sort" id="sort" aria-label="Sort"></select>
    <button class="icon-btn" id="filterToggle" aria-expanded="false">Filters</button>
  </div>
  <div class="active-filters" id="active"></div>
  <div class="layout">
    <aside class="facets" id="facets" aria-label="Categories"></aside>
    <section>
      <div class="result-meta" id="meta"></div>
      <div id="results"></div>
      <nav class="pager" id="pager" aria-label="Pages"></nav>
    </section>
  </div>
</main>

<dialog id="dlg" aria-label="Album details">
  <div class="dlg-head"><button class="icon-btn" id="dlgClose" aria-label="Close">✕</button></div>
  <div id="dlgBody"></div>
</dialog>

<div class="player" id="player" hidden>
  <div class="wrap">
    <img id="npCover" alt="">
    <div class="np"><b id="npTitle"></b><span id="npSub"></span></div>
    <button class="icon-btn" id="prevBtn" aria-label="Previous track">⏮</button>
    <button class="icon-btn" id="nextBtn" aria-label="Next track">⏭</button>
    <audio id="audio" controls preload="none"></audio>
    <iframe id="spEmbed" title="Spotify player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" hidden></iframe>
    <button class="icon-btn" id="closePlayer" aria-label="Close player">✕</button>
  </div>
</div>

/h2>\n<p>Nikhil Banerjee was a child prodigy from Calcutta. He became a disciple of <strong>Allauddin Khan<\/strong> at Maihar and later studied with\nAli Akbar Khan and Annapurna Devi. Unlike his fellow Maihar sitarist Ravi Shankar, he avoided showmanship and fusion. His playing is\ninward, unhurried and deeply lyrical, combining Maihar's <em>been<\/em>-like alaap with a distinctive tone. Many musicians\nconsider him the purest sitarist of his generation. He died of a heart attack in 1986, aged 54.<\/p>\n<h2>About the album<\/h2>\n<p>This is a Saregama compilation of his HMV recordings. The cover reproduces an original LP sleeve: <strong>Raga Jaunpuri • Raga Mand,\ntabla Swapan Chowdhury<\/strong>, which corresponds to tracks 4 and 5. Highlights include a 25-minute <strong>Hemant<\/strong> (alaap, jod, jhala),\n<strong>Komal Rishabh Asavari<\/strong>, and two complete Mishra Shivranjani performances.<\/p>\n<h2>Track notes<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Piece<\/th>\n<th>Raga<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Dhun – Baul<\/td>\n<td>Bengali folk<\/td>\n<td>full-band<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Mishra Gara (thumri style)<\/td>\n<td>Mishra Gara<\/td>\n<td>8 min<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Mishra Shivranjani – vilambit gat<\/td>\n<td>Shivranjani<\/td>\n<td>Rupak, 28 min<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Jaunpuri – vilambit &amp; drut<\/td>\n<td>Jaunpuri<\/td>\n<td>from the cover LP<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Mand – Sitarkhani<\/td>\n<td>Mand<\/td>\n<td>from the cover LP<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Adana – Gat<\/td>\n<td>Adana<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Megh – Alaap<\/td>\n<td>Megh<\/td>\n<td>⚠ mono, ~8 kHz<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Mishra Gara (thumri style)<\/td>\n<td>Mishra Gara<\/td>\n<td>6 min, different take<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Komal Rishabh Asavari<\/td>\n<td>Komal Re Asavari<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td al Ghosh<\/strong> (bansuri) · Maihar (Senia) gharana<\/p>\n<h2>About the artist<\/h2>\n<p><strong>Pannalal Ghosh<\/strong> (1911–1960) turned the bansuri, a folk and devotional instrument, into a <strong>concert instrument for classical music<\/strong>.\nHe designed a 32-inch bass flute and added a seventh hole, which made it possible to play the slow alaap and meend that\nkhayal-style instruments need. He learned from Khushi Mohammad Khan and Girija Shankar Chakravarty and later from <strong>Allauddin Khan<\/strong> of Maihar,\nguru of Ravi Shankar and Ali Akbar Khan. He also worked in film and on All India Radio's National Orchestra, and created ragas of his own,\nincluding <strong>Deepawali<\/strong> and <strong>Chandramauli<\/strong> (both on this album). He died in 1960, aged 48. Hariprasad Chaurasia (on <em>Call of the Valley<\/em>)\nfollowed the path he opened.<\/p>\n<h2>About the album<\/h2>\n<p>A Saregama compilation (dated 1990) from HMV and radio-era recordings, nearly all made before 1960. It ranges from long performances of\n<strong>Shree, Yaman, Darbari and Basant<\/strong> to short thumris, Bhatiyali, and two ragas of his own.<\/p>\n<h2>Track notes<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Piece<\/th>\n<th>Raga<\/th>\n<th>Length<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Gat – Shree<\/td>\n<td>Shree<\/td>\n<td>19:16<\/td>\n<td>19 min, mono<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Raga : Bhairavi – Pannalal Ghosh<\/td>\n<td>Bhairavi<\/td>\n<td>8:17<\/td>\n<td>band-limited<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Thumri Pilu<\/td>\n<td>Pilu<\/td>\n<td>3:25<\/td>\n<td>3 min<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Yaman<\/td>\n<td>Yaman<\/td>\n<td>18:56<\/td>\n<td>19 min, mono<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Bhatiyali Dhun<\/td>\n<td><em>not named<\/em><\/td>\n<td>6:26<\/td>\n<td>band-limited<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Darbari<\/td>\n<td>Darbari Kanada<\/td>\n<td>27:30<\/td>\n<td>27 min<\/td>\n<\/tr>\n<tr>\n td>\n<td>18:41<\/td>\n<td>louder master<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Maru Bihag<\/td>\n<td>Maru Bihag<\/td>\n<td>11:20<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Pilu Thumri<\/td>\n<td>Pilu<\/td>\n<td>9:36<\/td>\n<td>louder master<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>About this archive copy<\/h2>\n<ul>\n<li>Source: Saregama HD WAV (16-bit / 44.1 kHz), downloaded track by track from the Saregama download manager on 2026-11-19 and converted losslessly to FLAC. The decoded audio was checked bit-for-bit against the WAVs.<\/li>\n<li>Track order follows the Saregama album page (album id 103942).<\/li>\n<li>Ragas not given by Saregama were taken from HMV LP listings where possible. Entries marked <em>probable<\/em> or <em>unconfirmed<\/em> should be checked by ear.<\/li>\n<li>This release has <strong>only three distinct performances in five tracks<\/strong>. The two Pilu tracks are the same recording in two masterings\n  (loudness-envelope correlation 0.97, levels 5.8 dB apart), and the two Saraswati tracks very likely are too (0.74 after a 1.8 s shift, levels 5.4 dB apart).\n  All five are kept as sold. Track 1 shows a soft roll-off near 14 kHz; tracks 3 and 5 are the louder, fuller masters.<\/li>\n<\/ul>", "dur": 4078, "durText": "1:07:58", "folder": null, "tracks": [{"n": 1, "title": "Pilu – Thumri", "raga": "Pilu", "ragaBase": "Pilu", "unconfirmed": false, "tala": "", "time": "Any time (light raga)", "times": ["Any time"], "forms": ["Thumri"], "artists": ["Pt. Ram Narayan"], "players": ["Pt. Ram Narayan (sarangi)"], "instruments": ["sarangi"], "notes": "A thumri-style Pilu, the light, folk-flavoured raga at the heart of the sarangi's old role accompanying thumri singers. This is the same performance as track 5 in a different mastering (envelope correlation 0.97), about 5.8 dB quieter.", "bonus": false, "dur": 577, "durText": "9:37", "audio": null, "spotify": "7bnBq1H4kkVebCrS8AMjCc", "ytm": "ZZKLr9ZNnkg", "ytv": "", "ragaKey": "Pilu"}, {"n": 2, "title": "Saraswati – Alaap, Gat", "raga": "Saraswati", "ragaBase": "Saraswati", "unconfirmed": false, "tala": "", "time": "Night", "times": ["Night"], "forms": ["Alaap", "Gat"], "artists": ["Pt. Ram Narayan"], "players": ["Pt. Ram Narayan (sarangi)"], "instruments": ["sarangi"], "notes": "Saraswati, a raga borrowed from the Carnatic tradition (Sa Re tivra-Ma Pa Dha komal-Ni, without Ga), bright and devotional. Same length and very likely the same performance as track 3 (envelope correlation 0.74 after a 1.8 s shift), about 5 dB quieter.", "bonus": false, "dur": 1121, "durText": "18:41", "audio": null, "spotify": "1abe8CN5ye4B7DXphMqtYD", "ytm": "krtf8qu43tA", "ytv": "", "ragaKey": "Saraswati"}, {"n": 3, "title": "Saraswati – Alaap, Vilambit Gat", "raga": "Saraswati", "ragaBase": "Saraswati", "unconfirmed": false, "tala": "", "time": "Night", "times": ["Night"], "forms": ["Alaap", "Gat"], "artists": ["Pt. Ram Narayan"], "players": ["Pt. Ram Narayan (sarangi)"], "instruments": ["sarangi"], "notes": "Alaap and vilambit gat in Saraswati. See track 2: very likely the same performance in a louder mastering.", "bonus": false, "dur": 1122, "durText": "18:42", "audio": null, "spotify": "60GiC7rWfgsOLBusNEWjt0", "ytm": "aoMTAUGNM3A", "ytv": "", "ragaKey": "Saraswati"}, {"n": 4, "title": "Maru Bihag", "raga": "Maru Bihag", "ragaBase": "Maru Bihag", "unconfirmed": false, "tala": "", "time": "Night", "times": ["Night"], "forms": [], "artists": ["Pt. Ram Narayan"], "players": ["Pt. Ram Narayan (sarangi)"], "instruments": ["sarangi"], "notes": "Maru Bihag, the Bihag-family night raga with both Ma's, popularised in the 20th century. Ram Narayan's sustained, singing tone shows how the sarangi imitates the voice.", "bonus": false, "dur": 681, "durText": "11:21", "audio": null, "spotify": "0pke4hz01jOhDNN6mTuNK3", "ytm": "ZBSXrKzXs7s", "ytv": "", "ragaKey": "Maru Bihag"}, {"n": 5, "title": "Pilu Thumri", "raga": "Pilu", "ragaBase": "Pilu", "unconfirmed": false, "tala": "", "time": "Any time (light raga)", "times": ["Any time"], "forms": ["Thumri"], "artists": ["Pt. Ram Narayan"], "players": ["Pt. Ram Narayan (sarangi)"], "instruments": ["sarangi"], "notes": "Pilu thumri: the same performance as track 1, in a louder mastering.", "bonus": false, "dur": 577, "durText": "9:37", "audio": null, "spotify": "7bnBq1H4kkVebCrS8AMjCc", "ytm": "gY6dFDTQVg8", "ytv": "", "ragaKey": "Pilu"}], "spotify": "2b56PCkfQHYEk0LPh2Q1zU", "owned": true, "spotifyKind": "album", "spotifyNote": "", "status": "In Archive", "ytmAlbum": "OLAK5uy_kHxBCrDSqyg2jOJT8T3j2t2M86YVZt0A4", "impressionsHtml": ""}, {"id": "shivkumar-sharma-brij-bhushan-kabra-hariprasad-chaurasia-call-of-the-valley", "title": "Call of the Valley", "artist": "Shivkumar Sharma, Brij Bhushan Kabra & Hariprasad Chaurasia", "year": "1967", "genre": "Hindustani", "styles": ["Indian Classical"], "label": "Saregama", "originalLabel": "His Master's Voice (The Gramophone Company of India / EMI)", "catalog": "ECSD 2382 (original LP)", "gharana": "", "type": "Instrumental", "instruments": ["bansuri", "santoor", "slide guitar", "tabla"], "performers": ["Shivkumar Sharma (santoor)", "Brij Bhushan Kabra (slide guitar)", "Hariprasad Chaurasia (bansuri)", "Manikrao Popatkar (tabla)"], "saregama": "", "musicbrainz": "https://musicbrainz.org/release-group/6329db5a-77c2-30b4-9fa0-aca1151f7e26", "source": "Saregama WAV purchase (16-bit / 44.1 kHz), losslessly converted to FLAC", "cover": "covers/shivkumar-sharma-brij-bhushan-kabra-hariprasad-chaurasia-call-of-the-valley.jpg", "thumb": "covers/shivkumar-sharma-brij-bhushan-kabra-hariprasad-chaurasia-call-of-the-valley_thumb.jpg", "extras": [{"src": "covers/shivkumar-sharma-brij-bhushan-kabra-hariprasad-chaurasia-call-of-the-valley_extra1.jpg", "label": "Cover - Hemisphere 1995 CD reissue"}], "blurb": "", "notesHtml": "<p><strong>Shivkumar Sharma<\/strong> (santoor) · <strong>Brij Bhushan Kabra<\/strong> (slide guitar) · <strong>Hariprasad Chaurasia<\/strong> (bansuri) · <strong>Manikrao Popatkar<\/strong> (tabla)<\/p>\n<p>Original release: His Master's Voice / The Gramophone Company of India (EMI), LP ECSD 2382.\nRecorded in 1967; the Indian LP is often dated 1968. Now in the Saregama catalogue.<\/p>\n<h2>The concept<\/h2>\n<p><em>Call of the Valley<\/em> is a suite that follows one day in the life of a shepherd in the Kashmir valley.\nHindustani ragas are traditionally tied to particular hours, and the album uses that convention to tell the story,\nmoving from dawn ragas (Ahir Bhairav and Nat Bhairav) to daytime (Pilu), evening (Bhoop), night (Des) and the folk\nmelodies of the hills (Pahadi). Unlike a conventional classical recital, where one raga is explored at length,\nthe album works as a series of shorter movements, loosely like a symphony. It has no vocals and no film-style orchestration.<\/p>\n<h2>The instruments and the players<\/h2>\n<p>Hindustani classical music at the time centred on sitar, sarod, shehnai and the voice. None of the three\nmelody instruments here was established on the classical stage:<\/p>\n<ul>\n<li><strong>Santoor<\/strong>: a hammered dulcimer from the Sufiana music of Kashmir, a fitting choice for this subject. Shivkumar Sharma\n  (c. 1938 – 10 May 2022) was the musician who made it a classical concert instrument.<\/li>\n<li><strong>Bansuri<\/strong>: the bamboo flute. Hariprasad Chaurasia (b. 1938) became its best-known exponent worldwide.<\/li>\n<li><strong>Slide guitar<\/strong>: Brij Bhushan Kabra played Hawaiian-style slide guitar and was among the first to adapt the guitar to raga music.\n  The guitar was a big reason the record reached Western listeners.<\/li>\n<\/ul>\n<p>Most of the musicians were about 30 at the time. The album made them stars. It was also Sharma and Chaurasia's first\ncollaboration; as <strong>Shiv–Hari<\/strong> they went on to score Hindi films including <em>Silsila<\/em> (1981), <em>Chandni<\/em> (1989),\n<em>Lamhe<\/em> (1991) and <em>Darr<\/em> (1993).<\/p>\n<h2>Track notes<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Piece<\/th>\n<th>Tala<\/th>\n<th>Time<\/th>\n<th>Players<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Ahir Bhairav<\/td>\n<td>(alap)<\/td>\n<td>dawn<\/td>\n<td>ensemble<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Nat Bhairav<\/td>\n<td>Ektaal, 12<\/td>\n<td>early morning<\/td>\n<td>ensemble + tabla<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Piloo<\/td>\n<td>Teentaal, 16<\/td>\n<td>day<\/td>\n<td>ensemble + tabla<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Bhoop<\/td>\n<td>Jhaptaal, 10<\/td>\n<td>evening<\/td>\n<td>ensemble + tabla<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Des<\/td>\n<td>Dadra, 6<\/td>\n<td>night<\/td>\n<td>ensemble + tabla<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Pahadi<\/td>\n<td>Keherwa, 8<\/td>\n<td>(folk)<\/td>\n<td>ensemble + tabla<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Ghara – Dadra <em>(bonus)<\/em><\/td>\n<td>Dadra, 6<\/td>\n<td><\/td>\n<td>Kabra + tabla<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Bageshwari <em>(bonus)<\/em><\/td>\n<td><\/td>\n<td>late night<\/td>\n<td>Chaurasia + tabla<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Tracks 1 and 2 were a single movement on the original LP (\"Ahir Bhairav / Nat Bhairav\", 12:35). The original LP had\nonly tracks 1–6 and ran about 40 minutes. The 1995 EMI Hemisphere CD (CD EMC 3707) added three bonus pieces: Ghara–Dadra,\n<em>Dhun – Mishra Kirwani<\/em> (a santoor feature, 12:58) and Bageshwari. <strong>This Saregama download has no Dhun – Mishra Kirwani.<\/strong><\/p>\n<p>Per-track notes on each raga are embedded in each FLAC's <code>COMMENT<\/code> tag.<\/p>\n<h2>Reception and legacy<\/h2>\n<ul>\n<li>Widely called the best-selling Indian classical album ever, and a milestone in what was later called \"world music\".<\/li>\n<li>AllMusic gave it five stars. Ken Hunt wrote that if a newcomer buys only one Indian classical record, it should be this one.<\/li>\n<li>Listed in <em>1001 Albums You Must Hear Before You Die<\/em>.<\/li>\n<li>Admirers have included George Harrison and Paul McCartney, David Crosby and Roger McGuinn of the Byrds, and Bob Dylan.<\/li>\n<li>Around its 30th anniversary, the work was revisited in concert and released by Navras Records as the DVD set\n  <em>The Valley Recalls<\/em>. Kabra was too ill to perform, and Anindo Chatterjee played tabla. The Bhoop gat was expanded into a\n  90-minute jugalbandi.<\/li>\n<\/ul>\n<h2>About this archive copy<\/h2>\n<ul>\n<li>Source: Saregama WAV purchase, PCM 16-bit / 44.1 kHz stereo, converted losslessly to FLAC (level 8).\n  The decoded audio was checked bit-for-bit against the WAVs.<\/li>\n<li>Track titles and tala names follow the original Indian LP (ECSD 2382) as catalogued on MusicBrainz.<\/li>\n<li>Note: Bhoop runs 5:13 in this download, compared with about 6:15 on catalogued CD issues.<\/li>\n<li>Source-quality note: in the Saregama WAVs, <strong>Pahadi<\/strong> and <strong>Ghara – Dadra<\/strong> are dual-mono (left and right channels\n  identical) and nearly band-limited at about 8 kHz (content above 12 kHz sits at about −90 dB, against about −58 dB on Pilu).\n  The other tracks are true stereo with full bandwidth. These two look like a weaker transfer; consider replacing them\n  if a better master turns up.<\/li>\n<\/ul>\n<h3>Sources<\/h3>\n<ul>\n<li>Wikipedia: Call of the Valley; Shiv–Hari<\/li>\n<li>MusicBrainz release group 6329db5a-77c2-30b4-9fa0-aca1151f7e26 (LP ECSD.2382; Hemisphere CD EMC 3707)<\/li>\n<li>India Currents, \"A Classic Revived\"<\/li>\n<li>AllMusic review (Ken Hunt)<\/li>\n<li>Cover art: Cover Art Archive (Saregama reissue front, Hemisphere 1995 CD front)<\/li>\n<\/ul>", "dur": 3407, "durText": "56:47", "folder": null, "tracks": [{"n": 1, "title": "Ahir Bhairav", "raga": "Ahir Bhairav", "ragaBase": "Ahir Bhairav", "unconfirmed": false, "tala": "", "time": "Dawn", "times": ["Dawn"], "forms": [], "artists": ["Shivkumar Sharma", "Brij Bhushan Kabra", "Hariprasad Chaurasia"], "players": ["Shivkumar Sharma (santoor)", "Brij Bhushan Kabra (slide guitar)", "Hariprasad Chaurasia (bansuri)"], "instruments": ["bansuri", "santoor", "slide guitar"], "notes": "The suite opens at first light. Ahir Bhairav, a dawn raga, takes the flattened second (komal Re) of Bhairav and the flattened seventh (komal Ni) of Kafi. The result is grave but warm, and suits a shepherd waking in the valley. On the original LP this piece and Nat Bhairav formed one continuous first movement (12:35).", "bonus": false, "dur": 377, "durText": "6:17", "audio": null, "spotify": "6kIRhMJEuAKq4JsOKAMsnY", "ytm": "Wjgi7OoNyRg", "ytv": "", "ragaKey": "Ahir Bhairav"}, {"n": 2, "title": "Nat Bhairav – Ek Tala", "raga": "Nat Bhairav", "ragaBase": "Nat Bhairav", "unconfirmed": false, "tala": "Ektaal (12 beats)", "time": "Early morning", "times": ["Dawn"], "forms": [], "artists": ["Shivkumar Sharma", "Brij Bhushan Kabra", "Hariprasad Chaurasia", "Manikrao Popatkar"], "players": ["Shivkumar Sharma (santoor)", "Brij Bhushan Kabra (slide guitar)", "Hariprasad Chaurasia (bansuri)", "Manikrao Popatkar (tabla)"], "instruments": ["bansuri", "santoor", "slide guitar", "tabla"], "notes": "The second half of the dawn movement, where the tabla enters in 12-beat Ektaal. Nat Bhairav uses a natural second with a flattened sixth (komal Dha), the same scale as the Western harmonic major. It is brighter and more forward-moving than Ahir Bhairav, as if the day has begun.", "bonus": false, "dur": 384, "durText": "6:24", "audio": null, "spotify": "4KrXCZqKm2880zIi1ywvfU", "ytm": "W2On_-0eBAQ", "ytv": "", "ragaKey": "Nat Bhairav"}, {"n": 3, "title": "Piloo – Teen Tala", "raga": "Pilu", "ragaBase": "Pilu", "unconfirmed": false, "tala": "Teentaal (16 beats)", "time": "Late morning / day", "times": ["Morning", "Day"], "forms": [], "artists": ["Shivkumar Sharma", "Brij Bhushan Kabra", "Hariprasad Chaurasia", "Manikrao Popatkar"], "players": ["Shivkumar Sharma (santoor)", "Brij Bhushan Kabra (slide guitar)", "Hariprasad Chaurasia (bansuri)", "Manikrao Popatkar (tabla)"], "instruments": ["bansuri", "santoor", "slide guitar", "tabla"], "notes": "Pilu is a light-classical raga with folk roots and is famously flexible: it freely mixes natural and flattened forms of several notes. It is used widely for thumri and folk-flavoured pieces, and its playful, wistful character fits the herds moving out to graze.", "bonus": false, "dur": 471, "durText": "7:51", "audio": null, "spotify": "21T2zIfPMvmVHUqpBY2YIi", "ytm": "QphuNb7KXnM", "ytv": "", "ragaKey": "Pilu"}, {"n": 4, "title": "Bhoop – Jhap Tala", "raga": "Bhoop (Bhupali)", "ragaBase": "Bhoop", "unconfirmed": false, "tala": "Jhaptaal (10 beats)", "time": "Evening (first quarter of the night)", "times": ["Evening", "Night"], "forms": [], "artists": ["Hariprasad Chaurasia", "Brij Bhushan Kabra", "Shivkumar Sharma", "Manikrao Popatkar"], "players": ["Hariprasad Chaurasia (bansuri)", "Brij Bhushan Kabra (slide guitar)", "Shivkumar Sharma (santoor)", "Manikrao Popatkar (tabla)"], "instruments": ["bansuri", "santoor", "slide guitar", "tabla"], "notes": "Bhoop is pentatonic (Sa Re Ga Pa Dha), close to the major pentatonic of folk music everywhere, which helps explain why Western listeners took to the album. It is set in 10-beat Jhaptaal (2+3+2+3). The 1997 Navras concert DVD 'The Valley Recalls' expanded this Bhoop gat into a 90-minute jugalbandi. Note: this Saregama file runs 5:13, while catalogued CD issues list Bhoop at about 6:15.", "bonus": false, "dur": 313, "durText": "5:13", "audio": null, "spotify": "2cp93CtKRe5LKpD9GsmUpK", "ytm": "CmnpcHEHpc4", "ytv": "", "ragaKey": "Bhoopali"}, {"n": 5, "title": "Des – Dadra Tala", "raga": "Des (Desh)", "ragaBase": "Des", "unconfirmed": false, "tala": "Dadra (6 beats)", "time": "Night", "times": ["Night"], "forms": ["Dadra"], "artists": ["Shivkumar Sharma", "Brij Bhushan Kabra", "Hariprasad Chaurasia", "Manikrao Popatkar"], "players": ["Shivkumar Sharma (santoor)", "Brij Bhushan Kabra (slide guitar)", "Hariprasad Chaurasia (bansuri)", "Manikrao Popatkar (tabla)"], "instruments": ["bansuri", "santoor", "slide guitar", "tabla"], "notes": "Des is a night raga from the Khamaj family. It is associated with the monsoon and with yearning, and is familiar across India through 'Vande Mataram'. Here it is set in a lilting 6-beat Dadra.", "bonus": false, "dur": 362, "durText": "6:02", "audio": null, "spotify": "2g5NDr7oa36wR84micoVsP", "ytm": "KKLEpk_DXkE", "ytv": "", "ragaKey": "Desh"}, {"n": 6, "title": "Pahadi – Kehrawa Tala", "raga": "Pahadi", "ragaBase": "Pahadi", "unconfirmed": false, "tala": "Keherwa (8 beats)", "time": "Any time (folk raga)", "times": ["Any time"], "forms": [], "artists": ["Shivkumar Sharma", "Brij Bhushan Kabra", "Hariprasad Chaurasia", "Manikrao Popatkar"], "players": ["Shivkumar Sharma (santoor)", "Brij Bhushan Kabra (slide guitar)", "Hariprasad Chaurasia (bansuri)", "Manikrao Popatkar (tabla)"], "instruments": ["bansuri", "santoor", "slide guitar", "tabla"], "notes": "Pahadi means 'of the mountains'. The raga comes from the folk melodies of the Himalayan hills, including Kashmir and Himachal, so it is a natural close for a Kashmir suite. It is set in Keherwa, the 8-beat folk and light-music cycle. This was the last track of the original 1967 LP.", "bonus": false, "dur": 408, "durText": "6:48", "audio": null, "spotify": "4fWcwssoqMwQ6Nn8F9xRtL", "ytm": "", "ytv": "", "ragaKey": "Pahadi"}, {"n": 7, "title": "Ghara – Dadra", "raga": "Ghara", "ragaBase": "Ghara", "unconfirmed": false, "tala": "Dadra (6 beats)", "time": "Night", "times": ["Night"], "forms": ["Dadra"], "artists": ["Brij Bhushan Kabra", "Manikrao Popatkar"], "players": ["Brij Bhushan Kabra (slide guitar)", "Manikrao Popatkar (tabla)"], "instruments": ["slide guitar", "tabla"], "notes": "Bonus track (first added on the 1995 Hemisphere CD reissue): a solo for Brij Bhushan Kabra's slide guitar with tabla. Ghara is a light raga close to Khamaj and Pilu, and is common in thumri and dadra, the light-classical song forms.", "bonus": true, "dur": 445, "durText": "7:25", "audio": null, "spotify": "1LznMq4QnIw2lSK2Mu48UW", "ytm": "i8OUCgylix8", "ytv": "", "ragaKey": "Gara"}, {"n": 8, "title": "Bageshwari", "raga": "Bageshri", "ragaBase": "Bageshri", "unconfirmed": false, "tala": "", "time": "Late night", "times": ["Night"], "forms": [], "artists": ["Hariprasad Chaurasia", "Manikrao Popatkar"], "players": ["Hariprasad Chaurasia (bansuri)", "Manikrao Popatkar (tabla)"], "instruments": ["bansuri", "tabla"], "notes": "Bonus track (1995 Hemisphere CD reissue): Hariprasad Chaurasia's bansuri with tabla. Bageshri is a late-night raga from the Kafi family, traditionally the mood of a woman waiting for her beloved. It suits the end of the shepherd's day.", "bonus": true, "dur": 646, "durText": "10:46", "audio": null, "spotify": "6fy1tRi3pmrvFXFcWT3vKC", "ytm": "devnm-RK9GE", "ytv": "", "ragaKey": "Bageshri"}], "spotify": "1fmGwfVnsdYtMWiOuvM5YT", "owned": true, "spotifyKind": "album", "spotifyNote": "", "status": "In Archive", "ytmAlbum": "OLAK5uy_n7gfA9ujet4UeF7gAIEZLBI1TJ2ySozCo", "impressionsHtml": ""}, {"id": "ustad-ali-akbar-khan-ustad-ali-akbar-khan-sarod", "title": "Ustad Ali Akbar Khan – Sarod", "artist": "Ustad Ali Akbar Khan", "year": "", "genre": "Hindustani", "styles": ["Indian Classical", "Sarod"], "label": "Saregama", "originalLabel": "His Master's Voice (The Gramophone Company of India / EMI)", "catalog": "", "gharana": "Maihar (Senia Maihar)", "type": "Instrumental", "instruments": ["sarod"], "performers": ["Ustad Ali Akbar Khan (sarod)"], "saregama": "https://www.saregama.com/album/x_104692", "musicbrainz": "", "source": "Saregama HD WAV purchase (16-bit / 44.1 kHz), losslessly converted to FLAC", "cover": "covers/ustad-ali-akbar-khan-ustad-ali-akbar-khan-sarod.jpg", "thumb": "covers/ustad-ali-akbar-khan-ustad-ali-akbar-khan-sarod_thumb.jpg", "extras": [], "blurb": "A large Saregama compilation (2007) of HMV and live recordings: short early gats, full LP-side expositions and two live performances. Rare ragas include Lankadahan Sarang, Maligaura, Darbari Todi, Bhopal Todi, Lajwanti and Hindol Hem and Medhavi, attributed to him.", "notesHtml": "<p><strong>Ustad Ali Akbar Khan<\/strong> (sarod) · Maihar (Senia Maihar) gharana<\/p>\n<h2>About the artist<\/h2>\n<p><strong>Ali Akbar Khan<\/strong> (1922–2009) was the son of <strong>Allauddin Khan<\/strong>, the founder of the Maihar tradition, who trained him in long daily sessions from childhood.\nHis sarod playing combined the depth of dhrupad-style alaap with a huge rhythmic and melodic imagination. Yehudi Menuhin called him\n\"an absolute genius\" and \"the greatest musician in the world\". He was among the first to bring Indian classical music to the West (1955 onwards), founded\nthe <strong>Ali Akbar College of Music<\/strong> in California in 1967, and is credited with ragas of his own; <strong>Hindol Hem<\/strong> and <strong>Medhavi<\/strong> on this album are attributed to him.\nHe also took part in the <em>jugalbandi<\/em> tradition with his brother-in-law Ravi Shankar. Padma Vibhushan, 1989.<\/p>\n<h2>About the album<\/h2>\n<p>A large Saregama compilation (2007) of HMV and live recordings: short early gats, full LP-side expositions and two live performances.\nRare ragas include <strong>Lankadahan Sarang, Maligaura, Darbari Todi, Bhopal Todi, Lajwanti<\/strong> and <strong>Hindol Hem<\/strong> and <strong>Medhavi<\/strong>, attributed to him.<\/p>\n<h2>Track notes<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Piece<\/th>\n<th>Raga<\/th>\n<th>Length<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Hindol Hem – Gat Teentaal<\/td>\n<td>Hindol Hem<\/td>\n<td>18:45<\/td>\n<td>mono<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Jhinjhoti Manjh – Teentaal (Live)<\/td>\n<td>Jhinjhoti<\/td>\n<td>21:14<\/td>\n<td>live, 21 min<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Bilaskhani Todi<\/td>\n<td>Bilaskhani Todi<\/td>\n<td>6:43<\/td>\n<td>mono<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Alhaiya Bilawal<\/td>\n<td>Alh a compilation of long-form performances (10–30 minutes each), most in his signature slow-to-fast structure. It includes one of his own ragas, Chandramadhu, and two of his best-loved ragas, Darbari and Miyan Malhar.", "notesHtml": "<p><strong>Ustad Amir Khan<\/strong> (vocals, 1912–1974) · Indore gharana<\/p>\n<h2>About the artist<\/h2>\n<p>Amir Khan founded the <strong>Indore gharana<\/strong>. He drew on Abdul Wahid Khan's slow, introspective Kirana style, Rajab Ali Khan's\nvirtuosity and Aman Ali Khan's merukhand system of permutation-based note patterns, and the result was something new:\nan <em>ati-vilambit<\/em> (extremely slow) khayal, often in Jhumra, that unfolds note by note, closer to meditation than display.\nHe brought <strong>tarana<\/strong> back as a serious form, linking its syllables to Persian and Sufi meanings,\nand took Carnatic ragas such as <strong>Charukeshi<\/strong> into khayal. Film audiences know his voice from\n<em>Baiju Bawra<\/em> (1952) and <em>Jhanak Jhanak Payal Baaje<\/em> (1955). He died in a car accident in Calcutta in 1974.<\/p>\n<h2>About the album<\/h2>\n<p>This is a Saregama compilation of long-form performances (10–30 minutes each), most in his signature slow-to-fast structure.\nIt includes one of his own ragas, <strong>Chandramadhu<\/strong>, and two of his best-loved ragas, <strong>Darbari<\/strong> and <strong>Miyan Malhar<\/strong>.<\/p>\n<h2>Track notes<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Bandish<\/th>\n<th>Raga<\/th>\n<th>Tala<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Karam Karo + Tarana<\/td>\n<td>Shuddha Kalyan<\/td>\n<td>Jhumra<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Begun Kaamna Jaage<\/td>\n<td>Bageshri? (unconfirmed)<\/td>\n<td>Jhumra<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Man Sumarat Nis Din<\/td>\n<td>Bairagi<\/td>\n<td>Teentaal<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Laaj Rakho Tum Mori Gusaiyan<\/td>\n<td>Charukeshi<\/td>\n<td>Teentaal<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Chin Chin Baat 5], "source": "General reference"}, "Bhimpalasi": {"thaat": "Kafi", "mood": "Longing, romantic, the slow afternoon.", "aroha": ".n S g M P n Ṡ", "avaroha": "Ṡ n D P M g R S", "vadi": "M", "samvadi": "S", "pakad": ".n S M, M P g M, g R S", "nyas": "S, M, P", "note": "Re and Dha are skipped in ascent; resting on Ma and gliding down to komal Ga (M g) is the heart of the raga.", "time": "noon – 3 pm", "hours": [12, 15], "source": "Raga Vox (after D. Clarke, Rāgs Around the Clock)"}, "Puriya": {"thaat": "Marwa", "mood": "Deep, introspective evening.", "aroha": ".N r G M' D N Ṡ", "avaroha": "Ṡ N D M' G r S", "vadi": "G", "samvadi": "N", "note": "Marwa's notes with the weight shifted to the lower half, around Ga and Ni; Pa is omitted.", "time": "6 pm – 8 pm", "hours": [18, 20], "source": "Raga Vox (after D. Clarke, Rāgs Around the Clock)"}, "Adana": {"thaat": "Asavari", "mood": "Brisk, bold midnight.", "aroha": "S R M P d n Ṡ", "avaroha": "Ṡ d n P, M P g M R S", "vadi": "Ṡ", "samvadi": "P", "note": "A Kanada-family raga with Darbari's notes, but sung fast and high in the upper octave.", "time": "midnight – 2 am", "hours": [0, 2], "source": "Raga Vox (after D. Clarke, Rāgs Around the Clock)"}, "Karnataki Kafi": {"note": "A rare raga.", "source": "General reference"}, "Jangla": {"thaat": "Asavari", "note": "A light raga, mostly in thumri and dhun.", "source": "General reference"}, "Kafi": {"thaat": "Kafi", "mood": "Earthy, festive; the colour of Holi.", "aroha": "S R g M P D n Ṡ", "avaroha": "Ṡ n D P M g R S", "vadi": "P", "samvadi": "S", "pakad": "S R g M P, M g R, R g R S", "nyas": "S, P", "note": "Komal Ga and Ni move freely in a folk-like way; in hori and thumri, shuddh Ga and Ni sometimes appear as colour. Often sung as hori in spring.", "time": "9 pm – midnight", "hours": [21, 24], "source": "Raga Vox (after D. Clarke, Rāgs Around the Clock)"}, "Malkauns": {"thaat": "Bhairavi", "mood": "Meditative, profound, midnight stillness.", "aroha": ".n S g M d n Ṡ", "avaroha": "   const chips = [];
  if (S.q) chips.push(`<span class="chip on">“${esc(S.q)}” <button data-clear="q" aria-label="Clear search">×</button></span>`);
  for (const f of FACETS) if (S.f[f.key]) chips.push(`<span class="chip on">${esc(f.label)}: ${esc(S.f[f.key])} <button data-clear="${f.key}" aria-label="Remove filter">×</button></span>`);
  if (chips.length > 1) chips.push(`<button class="linkish" data-clear="all">Clear all</button>`);
  $("#active").innerHTML = chips.join("");
}

function pageSlice(list, size) {
  const pages = Math.max(1, Math.ceil(list.length / size));
  if (S.page > pages) S.page = pages;
  return { items: list.slice((S.page - 1) * size, S.page * size), pages };
}
function renderPager(pages) {
  if (pages <= 1) { $("#pager").innerHTML = ""; return; }
  const p = S.page, btns = [];
  btns.push(`<button data-page="${p - 1}" ${p === 1 ? "disabled" : ""} aria-label="Previous page">‹</button>`);
  const nums = new Set([1, pages, p - 1, p, p + 1].filter(n => n >= 1 && n <= pages));
  let last = 0;
  for (const n of [...nums].sort((a, b) => a - b)) {
    if (n - last > 1) btns.push(`<span aria-hidden="true">…</span>`);
    btns.push(`<button data-page="${n}" ${n === p ? 'aria-current="page"' : ""}>${n}</button>`);
    last = n;
  }
  btns.push(`<button data-page="${p + 1}" ${p === pages ? "disabled" : ""} aria-label="Next page">›</button>`);
  $("#pager").innerHTML = btns.join("");
}

const PLAY_ICON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>`;
const CHEV = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`;
const SP = (kind, id) => `https://open.spotify.com/${kind}/${id}`;
// local file if we have it, else the Spotify embed
const playBtn = t => t.audio ? `<button class="play" data-play="${t.uid}" aria-label="Play ${esc(t.title)}">${PLAY_ICON}</button>`
  : t.spotify ? `<button class="play" data-spplay="${t.uid}" aria-label="Play ${esc(t.title)} on Spotify" title="Play on Spotify">${PLAY_ICON}</button>` : "";
const ICON = {
  sp: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21Zm4.8 15.2a.65.65 0 0 1-.9.2c-2.5-1.5-5.6-1.9-9.3-1a.65.65 0 1 1-.3-1.3c4-.9 7.5-.5 10.3 1.2.3.2.4.6.2.9Zm1.3-2.8a.8.8 0 0 1-1.1.3c-2.8-1.7-7.2-2.2-10.5-1.2a.8.8 0 1 1-.5-1.6c3.8-1.1 8.6-.6 11.8 1.4.4.2.5.7.3 1.1Zm.1-3c-3.4-2-9-2.2-12.2-1.2a1 1 0 1 1-.6-1.9c3.7-1.1 9.9-.9 13.8 1.4a1 1 0 0 1-1 1.7Z"/></svg>`,
  ytm: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21Zm0 16.3a5.8 5.8 0 1 1 0-11.6 5.8 5.8 0 0 1 0 11.6Zm0-10.4a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2Zm-1.6 7.2V9.4L14.6 12l-4.2 2.6Z"/></svg>`,
  ytv: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8ZM9.7 15.1V8.9l5.8 3.1-5.8 3.1Z"/></svg>`,
};
const linkOf = { sp: id => SP("track", id), ytm: id => `https://music.youtube.com/watch?v=${id}`, ytv: id => `https://www.youtube.com/watch?v=${id}` };
const LABEL = { sp: "Spotify", ytm: "YouTube Music", ytv: "YouTube video" };
const linksRow = t => `<span class="slinks">${[["sp", t.spotify], ["ytm", t.ytm], ["ytv", t.ytv]].filter(x => x[1]).map(([k, id]) =>
  `<a class="slink ${k}" href="${linkOf[k](id)}" target="_blank" rel="noopener" title="${LABEL[k]}" aria-label="${LABEL[k]}: ${esc(t.title)}">${ICON[k]}</a>`).join("")}</span>`;
function ragaInfo(t) {
  const r = DATA.ragas && DATA.ragas[t.ragaKey];
  if (!r) return "";
  const head = t.ragaBase === t.ragaKey ? "" : (/^mishra /i.test(t.ragaBase) ? `${t.ragaBase} is a light (mishra) form of ${t.ragaKey}.` : `${t.ragaBase} = ${t.ragaKey}.`);
  const rows = [["Thaat", r.thaat], ["Time", r.time], ["Aroha", r.aroha, 1], ["Avaroha", r.avaroha, 1], ["Vadi / samvadi", r.vadi ? `${r.vadi} / ${r.samvadi || "–"}` : "", 1],
    ["Pakad", r.pakad, 1], ["Mood", r.mood], ["Note", r.note]].filter(x => x[1])
    .map(([k, v, sw]) => `<dt>${k}</dt><dd${sw ? ' class="swara"' : ""}>${esc(v)}</dd>`).join("");
  return `${head ? `<div>${esc(head)}</div>` : ""}<dl>${rows}</dl><div class="rsrc">${esc(r.source || "")}</div>`;
}
function ragaTag(t) {
  if (!t.raga) return "";
  return `<button class="tag raga" data-facet="raga" data-val="${esc(t.ragaBase)}" title="Filter by raga">${esc(t.ragaBase)}</button>` +
    (t.unconfirmed ? `<span class="tag warn" title="${esc(t.raga)}">unconfirmed</span>` : "");
}

function renderAlbums(tracks) {
  const byAlbum = new Map();
  tracks.forEach(t => byAlbum.set(t.album.id, (byAlbum.get(t.album.id) || 0) + 1));
  let list = ALBUMS.filter(a => byAlbum.has(a.id));
  const s = S.sort || "title";
  const cmp = { title: (a, b) => a.title.localeCompare(b.title), artist: (a, b) => a.artist.localeCompare(b.artist),
    year: (a, b) => (a.year || "9999").localeCompare(b.year || "9999"), dur: (a, b) => b.dur - a.dur, count: (a, b) => b.tracks.length - a.tracks.length }[s];
  // arrange by genre: biggest genre first, then the chosen sort inside each genre
  const gCount = new Map();
  list.forEach(a => gCount.set(a.genre, (gCount.get(a.genre) || 0) + 1));
  const gOrder = g => [-gCount.get(g), g];
  list.sort((a, b) => {
    const [ca, na] = gOrder(a.genre), [cb, nb] = gOrder(b.genre);
    return ca - cb || na.localeCompare(nb) || (b.owned - a.owned) || cmp(a, b);
  });
  const { items, pages } = pageSlice(list, ALBUM_PAGE);
  const nG = gCount.size;
  $("#meta").textContent = `${list.length} album${list.length === 1 ? "" : "s"}` + (nG > 1 ? ` in ${nG} genres` : "") + (anyFilter() ? ` · ${tracks.filter(t => !t.stub).length} matching tracks` : "");
  if (!items.length) { $("#results").innerHTML = `<div class="empty">No albums match. Try fewer filters.</div>`; renderPager(pages); return; }
  const groups = [];
  for (const a of items) {
    if (!groups.length || groups.at(-1).genre !== a.genre) groups.push({ genre: a.genre, albums: [] });
    groups.at(-1).albums.push(a);
  }
  $("#results").innerHTML = groups.map(g => `
    <section class="genre-group">
      <h2 class="genre-h"><button class="genre-link" data-facet="genre" data-val="${esc(g.genre)}" title="Show only ${esc(g.genre)}">${esc(g.genre)}</button>
        <span>${gCount.get(g.genre)} album${gCount.get(g.genre) === 1 ? "" : "s"}</span></h2>
      <div class="grid">` + g.albums.map(a => `
    <button class="card${a.owned ? "" : " not-owned"}" data-open="${a.id}">
      ${coverImg(a.thumb, "", a.title)}
      <div class="body">
        ${statusBadge(a)}
        <span class="t">${esc(a.title)}</span>
        <span class="a">${esc(a.artist)}</span>
        <span class="m">${[a.year, a.type, `${a.tracks.length || a.listedTracks || 0} tracks`, a.dur ? fmt(a.dur) : ""].filter(Boolean).map(esc).join(" · ")}</span>
        ${a.impressionsHtml ? `<span class="match">✎ My impressions</span>` : ""}
        ${anyFilter() && a.tracks.length && byAlbum.get(a.id) !== a.tracks.length ? `<span class="match">${byAlbum.get(a.id)} matching track${byAlbum.get(a.id) === 1 ? "" : "s"}</span>` : ""}
      </div>
    </button>`).join("") + `</div></section>`).join("");
  renderPager(pages);
}
function statusBadge(a) {
  return a.owned ? `<span class="badge own">In Archive</span>` : `<span class="badge stream">Streaming only</span>`;
}
function coverImg(src, cls, title) {
  if (src) return `<img ${cls ? `class="${cls}"` : ""} src="${src}" alt="" loading="lazy">`;
  const initials = (title || "♪").split(/\s+/).filter(w => /\w/.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "♪";
  return `<div class="ph ${cls}" aria-hidden="true">${esc(initials)}</div>`;
}

const expandedTracks = new Set();
function renderTracks(tracks) {
  const s = S.sort || "album";
  const list = [...tracks];
  if (s === "title") list.sort((a, b) => a.title.localeCompare(b.title));
  if (s === "raga") list.sort((a, b) => (a.ragaBase || "~").localeCompare(b.ragaBase || "~"));
  if (s === "dur") list.sort((a, b) => b.dur - a.dur);
  if (s === "short") list.sort((a, b) => a.dur - b.dur);
  const { items, pages } = pageSlice(list, TRACK_PAGE);
  $("#meta").textContent = `${list.length} track${list.length === 1 ? "" : "s"} · ${fmt(list.reduce((n, t) => n + t.dur, 0))}`;
  $("#results").innerHTML = items.length ? `<ul class="tracks">` + items.map(t => {
    const open = expandedTracks.has(t.uid);
    return `<li>
      <div class="trow">
        ${coverImg(t.album.thumb, "", t.album.title)}
        <div class="main">
          <div class="tt">${esc(t.title)}${t.bonus ? ' <span class="tag">bonus</span>' : ""}</div>
          <div class="sub">${esc(t.artists.join(", ") || t.album.artist)} · <a href="#album=${t.album.id}" data-open="${t.album.id}">${esc(t.album.title)}</a></div>
          <div class="tags">${ragaTag(t)}${t.tala ? `<span class="tag">${esc(t.tala)}</span>` : ""}${t.time ? `<span class="tag">${esc(t.time)}</span>` : ""}${t.album.owned ? `<span class="tag">In Archive</span>` : ""}</div>
        </div>
        <div class="right">${linksRow(t)}<span>${esc(t.durText)}</span>${playBtn(t)}
          <button class="expand" data-expand="${t.uid}" aria-expanded="${open}" aria-label="Show notes">${CHEV}</button></div>
      </div>
      ${open ? trackNotes(t) : ""}
    </li>`;
  }).join("") + `</ul>` : `<div class="empty">No tracks match. Try fewer filters.</div>`;
  renderPager(pages);
}
function trackNotes(t) {
  const rows = [["Raga", t.raga], ["Tala", t.tala], ["Time", t.time], ["Performers", t.players.join(", ")], ["Album", `${t.album.title}, track ${t.n}`]]
    .filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  const ri = ragaInfo(t);
  return `<div class="tnotes">${t.notes ? `<div>${esc(t.notes)}</div>` : ""}<dl>${rows}</dl>${ri ? `<div class="rbox"><h4 style="margin:12px 0 0;font:600 14px var(--serif)">About raga ${esc(t.ragaKey)}</h4>${ri}</div>` : ""}</div>`;
}

function render() {
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view));
  $("#sort").innerHTML = SORTS[S.view].map(([v, l]) => `<option value="${v}">Sort: ${l}</option>`).join("");
  $("#sort").value = S.sort && SORTS[S.view].some(x => x[0] === S.sort) ? S.sort : SORTS[S.view][0][0];
  if ($("#q").value !== S.q) $("#q").value = S.q;
  const tracks = filteredTracks();
  renderFacets(); renderActive();
  S.view === "albums" ? renderAlbums(tracks.concat(STUBS.filter(t => trackMatches(t)))) : renderTracks(tracks);
  syncDialog();
  markPlaying();
}

// ---------- album dialog ----------
const dlg = $("#dlg");
function syncDialog() {
  const a = ALBUMS.find(x => x.id === S.open);
  if (!a) { if (dlg.open) dlg.close(); return; }
  if (dlg.dataset.album !== a.id) {
    dlg.dataset.album = a.id;
    $("#dlgBody").innerHTML = albumDetail(a);
    dlg.scrollTop = 0;
  }
  if (!dlg.open) dlg.showModal();
}
function albumDetail(a) {
  const meta = [["Status", a.status], ["Tracks online", a.listedTracks && a.tracks.length && a.listedTracks !== a.tracks.length ? `Saregama lists ${a.listedTracks}; Spotify has ${a.tracks.length}` : ""], ["Year", a.year], ["Performers", a.performers.join(", ")], ["Gharana", a.gharana], ["Genre", a.genre], ["Style", a.styles.join(", ")],
    ["Original label", a.originalLabel], ["Catalog", a.catalog], ["Label", a.label], ["Length", `${a.tracks.length} tracks · ${fmt(a.dur)}`],
    ["Source", a.source], ["Folder", a.folder]].filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  const links = [
    a.tracks.some(t => t.audio) ? `<button class="btn primary" data-playalbum="${a.id}">${PLAY_ICON} Play album</button>` : "",
    !a.tracks.some(t => t.audio) && a.spotify ? `<button class="btn primary" data-spalbum="${a.id}">${PLAY_ICON} Play on Spotify</button>` : "",
    a.spotify ? `<a class="btn spotify" href="${SP(a.spotifyKind || "album", a.spotify)}" target="_blank" rel="noopener">Spotify ↗</a>`
      : `<a class="btn" href="https://open.spotify.com/search/${encodeURIComponent(a.title + " " + a.artist.replace(/\(.*?\)/g, ""))}" target="_blank" rel="noopener" title="Not found on Spotify — search instead">Search Spotify ↗</a>`,
    a.ytmAlbum ? `<a class="btn ytm" href="https://music.youtube.com/playlist?list=${a.ytmAlbum}" target="_blank" rel="noopener">YouTube Music ↗</a>` : "",
    a.saregama ? `<a class="btn" href="${a.saregama}" target="_blank" rel="noopener">Saregama ↗</a>` : "",
    a.musicbrainz ? `<a class="btn" href="${a.musicbrainz}" target="_blank" rel="noopener">MusicBrainz ↗</a>` : "",
  ].join("");
  return `<div class="detail">
    <div class="hero">
      <div>${a.cover ? `<img class="cover" src="${a.cover}" alt="Cover of ${esc(a.title)}">` : coverImg(null, "cover", a.title)}
        ${a.extras.length ? `<div class="extras">${a.extras.map(x => `<a href="${x.src}" target="_blank"><img src="${x.src}" alt=""><span>${esc(x.label)}</span></a>`).join("")}</div>` : ""}</div>
      <div>
        <h2>${esc(a.title)}</h2>
        <div class="by">${esc(a.artist)}</div>
        ${a.blurb && !a.notesHtml ? `<p class="about">${esc(a.blurb)}</p>` : ""}
        <dl class="meta">${meta}</dl>
        <div class="actions">${links}</div>
        ${a.spotifyNote ? `<p class="spnote">${esc(a.spotifyNote)}</p>` : !a.spotify ? `<p class="spnote">Not found on Spotify.</p>` : ""}
      </div>
    </div>
    <h3>Tracks</h3>
    <ol class="dtracks">${a.tracks.map(t => `<li>
      <span class="num">${t.n}</span>
      <div><div class="tt">${esc(t.title)}${t.bonus ? ' <span class="tag">bonus</span>' : ""}</div>
        <div class="tags">${ragaTag(t)}${t.tala ? `<span class="tag">${esc(t.tala)}</span>` : ""}${t.time ? `<span class="tag">${esc(t.time)}</span>` : ""}</div>
        ${t.notes ? `<div class="tn">${esc(t.notes)}</div>` : ""}
        ${ragaInfo(t) ? `<details class="rinfo"><summary>About raga ${esc(t.ragaKey)}</summary>${ragaInfo(t)}</details>` : ""}</div>
      <div class="dur">${linksRow(t)}${esc(t.durText)}${playBtn(t)}</div></li>`).join("")}</ol>
    ${a.impressionsHtml ? `<h3>My impressions</h3><div class="impressions">${a.impressionsHtml}</div>` : ""}
    ${a.notesHtml ? `<h3>Liner notes</h3><div class="liner">${a.notesHtml}</div>` : ""}
  </div>`;
}
dlg.addEventListener("close", () => { if (S.open) set({ open: "" }, { keepPage: true }); });
$("#dlgClose").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

// ---------- player ----------
const audio = $("#audio");
let queue = [], qi = -1;
function playerMode(sp) {
  $("#spEmbed").hidden = !sp; audio.hidden = sp; $("#prevBtn").hidden = sp; $("#nextBtn").hidden = sp;
  $("#npCover").hidden = sp; document.querySelector(".player .np").hidden = sp;
  document.body.classList.toggle("sp-mode", sp);
  if (sp) audio.pause(); else $("#spEmbed").src = "about:blank";
}
function spPlay(kind, id) {
  playerMode(true);
  $("#spEmbed").src = `https://open.spotify.com/embed/${kind}/${id}?utm_source=generator`;
  $("#player").hidden = false; document.body.classList.add("has-player");
}
$("#closePlayer").onclick = () => { audio.pause(); $("#spEmbed").src = "about:blank"; $("#player").hidden = true; document.body.classList.remove("has-player", "sp-mode"); };
function playQueue(list, i) {
  playerMode(false);
  queue = list.filter(t => t.audio); qi = i;
  const t = queue[qi]; if (!t) return;
  audio.src = t.audio.split("/").map(encodeURIComponent).join("/");
  audio.play().catch(() => {});
  $("#player").hidden = false; document.body.classList.add("has-player");
  $("#npCover").src = t.album.thumb || ""; $("#npCover").style.visibility = t.album.thumb ? "" : "hidden"; $("#npTitle").textContent = t.title;
  $("#npSub").textContent = [t.ragaBase, t.album.artist].filter(Boolean).join(" · ");
  document.title = `▶ ${t.title} — ${DATA.title}`;
  markPlaying();
}
function markPlaying() {
  const cur = queue[qi];
  document.querySelectorAll("[data-play]").forEach(b => b.classList.toggle("playing", !!cur && b.dataset.play === cur.uid && !audio.paused));
}
audio.addEventListener("ended", () => { if (qi + 1 < queue.length) playQueue(queue, qi + 1); else markPlaying(); });
audio.addEventListener("play", markPlaying); audio.addEventListener("pause", markPlaying);
$("#prevBtn").onclick = () => qi > 0 && playQueue(queue, qi - 1);
$("#nextBtn").onclick = () => qi + 1 < queue.length && playQueue(queue, qi + 1);

// ---------- events ----------
document.addEventListener("click", e => {
  const el = e.target.closest("button, a[data-open]");
  if (!el) return;
  const d = el.dataset;
  if (d.view) set({ view: d.view, sort: "" });
  else if (d.facet) {
    e.stopPropagation();
    const f = { ...S.f }; f[d.facet] === d.val ? delete f[d.facet] : (f[d.facet] = d.val);
    set({ f, open: "" });
  }
  else if (d.more) { facetExpanded.has(d.more) ? facetExpanded.delete(d.more) : facetExpanded.add(d.more); renderFacets(); }
  else if (d.clear) {
    if (d.clear === "all") set({ q: "", f: {} });
    else if (d.clear === "q") set({ q: "" });
    else { const f = { ...S.f }; delete f[d.clear]; set({ f }); }
  }
  else if (d.page) { set({ page: +d.page }); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (d.open) { e.preventDefault(); set({ open: d.open }, { keepPage: true }); }
  else if (d.expand) { expandedTracks.has(d.expand) ? expandedTracks.delete(d.expand) : expandedTracks.add(d.expand); render(); }
  else if (d.play) {
    const cur = queue[qi];
    if (cur && cur.uid === d.play) { audio.paused ? audio.play() : audio.pause(); return; }
    const t = TRACKS.find(x => x.uid === d.play);
    const ctx = S.open ? t.album.tracks : (S.view === "tracks" ? filteredTracks() : t.album.tracks);
    const list = ctx.filter(x => x.audio);
    playQueue(list, list.indexOf(t));
  }
  else if (d.spplay) { const t = TRACKS.find(x => x.uid === d.spplay); spPlay("track", t.spotify); }
  else if (d.spalbum) { const a = ALBUMS.find(x => x.id === d.spalbum); spPlay(a.spotifyKind || "album", a.spotify); }
  else if (d.playalbum) { const a = ALBUMS.find(x => x.id === d.playalbum); playQueue(a.tracks, 0); }
});
let qTimer;
$("#q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => set({ q: e.target.value.trim() }, { replace: true }), 180); });
$("#sort").addEventListener("change", e => set({ sort: e.target.value }));
$("#filterToggle").onclick = e => { const o = $("#facets").classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q") && !dlg.open) { e.preventDefault(); $("#q").focus(); }
});
window.addEventListener("popstate", () => { readHash(); render(); });
window.addEventListener("hashchange", () => { readHash(); render(); });

// theme toggle (remembered per browser)
const themeKey = "catalog-theme";
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem(themeKey)); } catch {}
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark"; applyTheme(next);
  try { localStorage.setItem(themeKey, next); } catch {}
};

readHash(); render();
</script>
</body>
</html>
