<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahesh&#x27;s Music Archive</title>
<meta name="description" content="A music catalog: albums by genre, with performers, ragas and liner notes.">
<style>
:root {
  --bg: #faf7f2; --surface: #ffffff; --surface-2: #f4efe7; --ink: #2a2420; --muted: #6f655c;
  --line: #e7dfd4; --accent: #9a3b1c; --accent-ink: #ffffff; --accent-soft: #f5e6da; --warn: #8a5a00; --warn-soft: #fbefd2;
  --shadow: 0 1px 2px rgb(60 40 20 / .06), 0 4px 16px rgb(60 40 20 / .06);
  --radius: 10px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161311; --surface: #201c19; --surface-2: #2a2521; --ink: #efe8df; --muted: #a89d91;
    --line: #3a332d; --accent: #e3956a; --accent-ink: #1b1411; --accent-soft: #3b2a20; --warn: #f0c46a; --warn-soft: #3a2f17;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161311; --surface: #201c19; --surface-2: #2a2521; --ink: #efe8df; --muted: #a89d91;
  --line: #3a332d; --accent: #e3956a; --accent-ink: #1b1411; --accent-soft: #3b2a20; --warn: #f0c46a; --warn-soft: #3a2f17;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
body.has-player { padding-bottom: 84px; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }

header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-top: 18px; padding-bottom: 18px; flex-wrap: wrap; }
h1 { font: 600 26px/1.15 var(--serif); margin: 0; letter-spacing: -.01em; }
.stats { color: var(--muted); font-size: 13px; }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.icon-btn:hover { background: var(--surface-2); }
.sitenav { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.sitenav a { padding: 6px 14px; text-decoration: none; color: var(--muted); font-size: 14px; }
.sitenav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 16px 0 8px; }
.search { flex: 1 1 280px; position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
select.sort { border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 8px 12px; }
#filterToggle { display: none; }

.active-filters { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; padding-bottom: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
.chip.on { background: var(--accent-soft); border-color: transparent; }
.chip button { border: 0; background: none; padding: 0; color: var(--muted); font-size: 15px; line-height: 1; }
.linkish { border: 0; background: none; color: var(--accent); padding: 3px 4px; font-size: 13px; }

.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; padding-bottom: 40px; }
aside.facets { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); overflow: auto; padding-right: 4px; }
.facet { border-bottom: 1px solid var(--line); padding: 10px 0; }
.facet summary { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.facet summary::-webkit-details-marker { display: none; }
.facet summary::after { content: "+"; }
.facet[open] summary::after { content: "–"; }
.facet ul { list-style: none; margin: 8px 0 0; padding: 0; }
.facet li button { width: 100%; display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: none; padding: 4px 8px; border-radius: 6px; font-size: 14px; }
.facet li button:hover { background: var(--surface-2); }
.facet li button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.facet li button[aria-pressed="true"] .ct { color: inherit; }
.facet li button:disabled { opacity: .4; cursor: default; }
.facet .ct { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.facet .more { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 4px 8px; }

.result-meta { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; text-align: left; padding: 0; transition: transform .12s ease; }
.card:hover { transform: translateY(-2px); }
.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--surface-2); }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; }
.card .t { font: 600 16px/1.25 var(--serif); }
.card .a { color: var(--muted); font-size: 13px; }
.card .m { color: var(--muted); font-size: 12px; margin-top: 4px; }
.genre-group + .genre-group { margin-top: 30px; }
.genre-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.genre-link { border: 0; background: none; padding: 0; font: 600 20px/1.2 var(--serif); color: var(--ink); text-align: left; }
.genre-link:hover { color: var(--accent); }
.genre-h span { color: var(--muted); font-size: 13px; font-weight: 400; font-family: var(--sans); }
.ph { display: grid; place-items: center; aspect-ratio: 1; width: 100%; background: linear-gradient(135deg, var(--accent-soft), var(--surface-2)); color: var(--accent); font: 600 28px var(--serif); }
.trow .ph { width: 44px; height: 44px; border-radius: 6px; font-size: 14px; }
.ph.cover { border-radius: 10px; font-size: 64px; }
.card .match { color: var(--accent); font-size: 12px; font-weight: 600; margin-top: 2px; }

.tracks { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.tracks > li + li { border-top: 1px solid var(--line); }
.trow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; }
.trow img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; }
.trow .main { min-width: 0; }
.trow .tt { font-weight: 600; }
.trow .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .right { display: flex; align-items: center; gap: 10px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); border: 0; }
button.tag:hover { background: var(--accent-soft); }
.tag.raga { background: var(--accent-soft); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.expand { border: 0; background: none; color: var(--muted); padding: 4px; }
.expand[aria-expanded="true"] svg { transform: rotate(180deg); }
.tnotes { padding: 0 12px 14px 68px; color: var(--ink); font-size: 14px; }
.tnotes dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 8px 0 0; font-size: 13px; }
.tnotes dt { color: var(--muted); }
.tnotes dd { margin: 0; }
.play { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; color: var(--accent); flex: none; }
.play:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.play.playing { background: var(--accent); color: var(--accent-ink); }

.pager { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 22px; flex-wrap: wrap; }
.pager button { min-width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 10px; }
.pager button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pager button:disabled { opacity: .4; cursor: default; }
.empty { padding: 40px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

dialog { border: 0; padding: 0; border-radius: 14px; width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--bg); color: var(--ink); box-shadow: 0 20px 60px rgb(0 0 0 / .35); }
dialog::backdrop { background: rgb(20 14 10 / .55); }
.dlg-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; padding: 10px; pointer-events: none; }
.dlg-head button { pointer-events: auto; }
.detail { padding: 0 28px 28px; margin-top: -40px; }
.hero { display: grid; grid-template-columns: 280px 1fr; gap: 26px; align-items: start; }
.hero img.cover { width: 100%; border-radius: 10px; box-shadow: var(--shadow); display: block; }
.extras { display: flex; gap: 8px; margin-top: 8px; }
.extras a { display: block; width: 64px; }
.extras img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; }
.extras span { display: block; font-size: 11px; color: var(--muted); line-height: 1.2; margin-top: 2px; }
.detail h2 { font: 600 30px/1.15 var(--serif); margin: 4px 0 4px; }
.detail .by { color: var(--muted); font-size: 16px; margin-bottom: 14px; }
.meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; margin: 0 0 14px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; text-decoration: none; color: var(--ink); font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.detail h3 { font: 600 19px/1.3 var(--serif); margin: 28px 0 10px; }
.dtracks { list-style: none; padding: 0; margin: 0; counter-reset: none; }
.dtracks li { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.dtracks .num { color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 4px; text-align: right; }
.dtracks .tt { font-weight: 600; }
.dtracks .tn { font-size: 14px; margin-top: 4px; }
.dtracks .dur { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.liner { font-size: 15px; max-width: 72ch; }
.liner h2 { font: 600 17px/1.3 var(--serif); margin: 22px 0 6px; }
.liner table { border-collapse: collapse; font-size: 13px; margin: 8px 0; display: block; overflow-x: auto; }
.liner th, .liner td { border-bottom: 1px solid var(--line); padding: 5px 10px 5px 0; text-align: left; vertical-align: top; }
.liner th { color: var(--muted); font-weight: 600; }
.liner ul { padding-left: 20px; }

.player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgb(0 0 0 / .08); z-index: 10; }
.player .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.player img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }
.player .np { min-width: 0; flex: 0 1 280px; }
.player .np b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.player .np span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player audio { flex: 1; min-width: 0; height: 40px; }
.player iframe { flex: 1; min-width: 0; height: 80px; border: 0; border-radius: 12px; }
body.has-player.sp-mode { padding-bottom: 104px; }
.splink { color: #1d7a46; text-decoration: none; font-size: 12px; white-space: nowrap; }
:root[data-theme="dark"] .splink { color: #4cc27f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .splink { color: #4cc27f; } }
.btn.spotify { background: #1d7a46; border-color: #1d7a46; color: #fff; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  #filterToggle { display: inline-flex; }
  aside.facets { display: none; position: static; max-height: none; }
  aside.facets.open { display: block; }
  .hero { grid-template-columns: 1fr; }
  .hero img.cover { max-width: 320px; }
  .detail { padding: 0 16px 20px; }
  .tnotes { padding-left: 12px; }
}
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .trow { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; }
  .trow img { width: 40px; height: 40px; }
  .player .np { flex-basis: 120px; }
  .player img { display: none; }
  h1 { font-size: 22px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1 id="siteTitle">Mahesh&#x27;s Music Archive</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="top-actions">
      <nav class="sitenav" aria-label="Site"><a href="index.html" aria-current="page">Archive</a><a href="streaming.html">Streaming</a></nav>
      <button class="icon-btn" id="themeBtn" title="Toggle light/dark" aria-label="Toggle light or dark theme">◐</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search ragas, artists, titles, notes…" autocomplete="off" aria-label="Search">
    </label>
    <div class="seg" role="group" aria-label="View">
      <button data-view="albums" aria-pressed="true">Albums</button>
      <button data-view="tracks" aria-pressed="false">Tracks</button>
    </div>
    <select class="sort" id="sort" aria-label="Sort"></select>
    <button class="icon-btn" id="filterToggle" aria-expanded="false">Filters</button>
  </div>
  <div class="active-filters" id="active"></div>
  <div class="layout">
    <aside class="facets" id="facets" aria-label="Categories"></aside>
    <section>
      <div class="result-meta" id="meta"></div>
      <div id="results"></div>
      <nav class="pager" id="pager" aria-label="Pages"></nav>
    </section>
  </div>
</main>

<dialog id="dlg" aria-label="Album details">
  <div class="dlg-head"><button class="icon-btn" id="dlgClose" aria-label="Close">✕</button></div>
  <div id="dlgBody"></div>
</dialog>

<div class="player" id="player" hidden>
  <div class="wrap">
    <img id="npCover" alt="">
    <div class="np"><b id="npTitle"></b><span id="npSub"></span></div>
    <button class="icon-btn" id="prevBtn" aria-label="Previous track">⏮</button>
    <button class="icon-btn" id="nextBtn" aria-label="Next track">⏭</button>
    <audio id="audio" controls preload="none"></audio>
    <iframe id="spEmbed" title="Spotify player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" hidden></iframe>
    <button class="icon-btn" id="closePlayer" aria-label="Close player">✕</button>
  </div>
</div>

<script>
const DATA = {"title": "Mahesh's Music Archive", "public": true, "albums": [{"id": "bismillah-khan-v-g-jog-jugalbandi", "title": "Jugalbandi", "artist": "Bismillah Khan & V. G. Jog", "year": "", "genre": "Hindustani Classical", "styles": ["Indian Classical", "Jugalbandi"], "label": "Saregama", "originalLabel": "His Master's Voice (The Gramophone Company of India / EMI)", "catalog": "", "gharana": "", "type": "Instrumental", "instruments": ["shehnai", "violin"], "performers": ["Bismillah Khan (shehnai)", "V. G. Jog (violin)"], "saregama": "https://www.saregama.com/album/x_56688", "musicbrainz": "", "source": "Saregama HD WAV purchase (16-bit / 44.1 kHz), losslessly converted to FLAC", "cover": "covers/bismillah-khan-v-g-jog-jugalbandi.jpg", "thumb": "covers/bismillah-khan-v-g-jog-jugalbandi_thumb.jpg", "extras": [], "blurb": "This is a Saregama compilation of the HMV studio duets, or jugalbandi, that Bismillah Khan and V. G. Jog recorded through the 1960s. In a jugalbandi two soloists share and trade phrases on equal footing. These records helped make the format popular on disc, and the pairing of shehnai and violin was unusual for its time. Some of the pieces trace back to specific LPs: Chandrakauns to Jugalbandi – Shehnai & Violin (HMV EALP 1279, early 1960s), Jaunpuri and Maru Bihag to EALP 1272 (c. 1962), and Bahar to EMI's Duets (1965).", "notesHtml": "<p><strong>Bismillah Khan<\/strong> (shehnai, 1916–2006) · <strong>V. G. Jog<\/strong> (violin, 1922–2004)<\/p>\n<h2>About the album<\/h2>\n<p>This is a Saregama compilation of the HMV studio duets, or <em>jugalbandi<\/em>, that Bismillah Khan and V. G. Jog recorded through the 1960s.\nIn a jugalbandi two soloists share and trade phrases on equal footing. These records helped make the format popular\non disc, and the pairing of shehnai and violin was unusual for its time.\nSome of the pieces trace back to specific LPs: Chandrakauns to <em>Jugalbandi – Shehnai &amp; Violin<\/em> (HMV EALP 1279, early 1960s),\nJaunpuri and Maru Bihag to EALP 1272 (c. 1962), and Bahar to EMI's <em>Duets<\/em> (1965).<\/p>\n<h2>The players<\/h2>\n<ul>\n<li><strong>Bismillah Khan<\/strong> took the shehnai, a double-reed instrument once played at weddings and temples, to the classical concert stage.\n  He was from Benaras, played on 15 August 1947 at India's first Independence Day, and received the Bharat Ratna in 2001.<\/li>\n<li><strong>V. G. (Vishnu Govind) Jog<\/strong> was one of the first to establish the violin as a Hindustani solo instrument. He trained under\n  Allauddin Khan among others, and played duets with many leading musicians.<\/li>\n<\/ul>\n<h2>Track notes<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Piece<\/th>\n<th>Raga<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Chandrakauns<\/td>\n<td>Chandrakauns<\/td>\n<td>late night<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Dhun<\/td>\n<td>—<\/td>\n<td>light tune<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Dhun in Mishra Khamaj<\/td>\n<td>Mishra Khamaj<\/td>\n<td>⚠ mono/band-limited transfer<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Dhun – Keharwa 2<\/td>\n<td>—<\/td>\n<td>8-beat Keherwa<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Bhairavi – Dadra<\/td>\n<td>Bhairavi<\/td>\n<td>6-beat Dadra<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Jaunpuri<\/td>\n<td>Jaunpuri<\/td>\n<td>late morning<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Maru Bihag<\/td>\n<td>Maru Bihag<\/td>\n<td>evening<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Pahadi – Dhun<\/td>\n<td>Pahadi<\/td>\n<td>folk<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Durga<\/td>\n<td>Durga<\/td>\n<td>night, pentatonic<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Bahar<\/td>\n<td>Bahar<\/td>\n<td>spring<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Mishra Khamaj<\/td>\n<td>Mishra Khamaj<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Todi – Alaap, Gat<\/td>\n<td>Todi<\/td>\n<td>morning, 20 min<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>About this archive copy<\/h2>\n<ul>\n<li>Source: Saregama HD WAV (16-bit / 44.1  and controversial among purists. Her concerts were known for their intensity and their long, unhurried\nraga development. She received the Padma Vibhushan in 2002 and was called <em>Gaan Saraswati<\/em>.<\/p>\n<h2>About the album<\/h2>\n<p>This is a Saregama compilation of her HMV recordings. Its centre is the <strong>Bhoop<\/strong> pair, vilambit <em>Eru aaj bhailava<\/em> followed by\ndrut <em>Sahelare aa mil gaaye<\/em>, long treated as the reference Bhoop. There are also long expositions of\n<strong>Shuddha Kalyan<\/strong> (37 min) and a 42-minute track titled <strong>Bhoop Nat<\/strong>.<\/p>\n<h2>Track notes<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Piece<\/th>\n<th>Raga<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Biraha Na Jala<\/td>\n<td><em>not named<\/em><\/td>\n<td>stereo<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Eru Aaj Bhailava<\/td>\n<td>Bhoop (vilambit)<\/td>\n<td>mono<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Aaj Sahiyo Na Jaaye<\/td>\n<td><em>not named<\/em><\/td>\n<td>mono<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Sahelare Aa Mil Gae<\/td>\n<td>Bhoop (drut)<\/td>\n<td>stereo<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Shuddha Kalyan<\/td>\n<td>Shuddha Kalyan<\/td>\n<td>37 min, mono<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Kausi Kanada<\/td>\n<td>Kausi Kanada<\/td>\n<td>mono<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Bhoop Nat<\/td>\n<td>as titled<\/td>\n<td>42 min, mono<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>\"Gazal\"<\/td>\n<td>⚠ probably mislabeled<\/td>\n<td>26 min, mono<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>To do<\/h2>\n<ul>\n<li>Identify the ragas for tracks 1 and 3, and the actual content of tracks 7 and 8, then update <code>albums/kishori_amonkar_classical_vocal.json<\/code> and re-run.<\/li>\n<\/ul>\n<h2>About this archive copy<\/h2>\n<ul>\n<li>Source: Saregama HD WAV (16-bit / 44.1 kHz), converted losslessly to FLAC. The decoded audio was checked bit-for-bit against the WAVs.<\/li>\n<li>Track order follows the Saregama albu ri, and Tu Hai Mohmadsha in Suha Kanada), ECLP 2253 (Karim Naam in Miyan Malhar, Puriya Kalyan) and ECLP 2264 (Lalit and Shuddha Kalyan).", "notesHtml": "<p><strong>Pt. Bhimsen Joshi<\/strong> (vocals) · Kirana gharana<\/p>\n<h2>About the artist<\/h2>\n<p><strong>Bhimsen Joshi<\/strong> (1922–2011) ran away from home as a boy to find a guru, and eventually became the disciple of\n<strong>Sawai Gandharva<\/strong> of the Kirana gharana. He became its most famous voice: a huge, resonant tone and a powerful, tan-heavy style\nthat drew on other gharanas too. He was equally loved for his Marathi abhangs and Kannada dasavani. He received the\n<strong>Bharat Ratna<\/strong>, India's highest civilian honour, in 2008, and founded the Sawai Gandharva Music Festival in Pune in his guru's name.<\/p>\n<h2>About the album<\/h2>\n<p>A Saregama compilation (2006) of Bhimsen Joshi's HMV recordings, from short early discs to LP-side expositions.\nThe LP listings that let me identify some ragas: <strong>EALP 1328<\/strong> (1968: Chhaya, Chhaya Malhar, Darbari, and <em>Tu Hai Mohmadsha<\/em> in Suha Kanada),\n<strong>ECLP 2253<\/strong> (<em>Karim Naam<\/em> in Miyan Malhar, Puriya Kalyan) and <strong>ECLP 2264<\/strong> (Lalit and Shuddha Kalyan).<\/p>\n<h2>Track notes<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Piece<\/th>\n<th>Raga<\/th>\n<th>Length<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Batiya Dore – Khayal<\/td>\n<td><em>not named<\/em><\/td>\n<td>3:24<\/td>\n<td>3 min, band-limited<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Tu Hai Mohamadsha – Khayal<\/td>\n<td>Suha Kanada<\/td>\n<td>4:43<\/td>\n<td>from EALP 1328<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Jamuna Ke Teer – Thumri<\/td>\n<td>Bhairavi<\/td>\n<td>8:14<\/td>\n<td>thumri<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Kareem Naam Tero, Ata Dhoom – Khayal<\/td>\n<td>Miyan Malhar<\/td>\n<td>18:11<\/td>\n<td>band-limited, near mono<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Dhan Dhan Bhag, Piya Nahin Aaye of the Valley<\/em> is a suite that follows one day in the life of a shepherd in the Kashmir valley.\nHindustani ragas are traditionally tied to particular hours, and the album uses that convention to tell the story,\nmoving from dawn ragas (Ahir Bhairav and Nat Bhairav) to daytime (Pilu), evening (Bhoop), night (Des) and the folk\nmelodies of the hills (Pahadi). Unlike a conventional classical recital, where one raga is explored at length,\nthe album works as a series of shorter movements, loosely like a symphony. It has no vocals and no film-style orchestration.<\/p>\n<h2>The instruments and the players<\/h2>\n<p>Hindustani classical music at the time centred on sitar, sarod, shehnai and the voice. None of the three\nmelody instruments here was established on the classical stage:<\/p>\n<ul>\n<li><strong>Santoor<\/strong>: a hammered dulcimer from the Sufiana music of Kashmir, a fitting choice for this subject. Shivkumar Sharma\n  (c. 1938 – 10 May 2022) was the musician who made it a classical concert instrument.<\/li>\n<li><strong>Bansuri<\/strong>: the bamboo flute. Hariprasad Chaurasia (b. 1938) became its best-known exponent worldwide.<\/li>\n<li><strong>Slide guitar<\/strong>: Brij Bhushan Kabra played Hawaiian-style slide guitar and was among the first to adapt the guitar to raga music.\n  The guitar was a big reason the record reached Western listeners.<\/li>\n<\/ul>\n<p>Most of the musicians were about 30 at the time. The album made them stars. It was also Sharma and Chaurasia's first\ncollaboration; as <strong>Shiv–Hari<\/strong> they went on to score Hindi films including <em>Silsila<\/em> (1981), <em>Chandni<\/em> (1989),\n<em>Lamhe<\/em> (1991) and <em>Darr<\/em> (1993).<\/p>\n<h2>Track notes<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Piece<\/th>\n<th>Tala<\/th>\n<th>Time<\/th>\n<th>Players<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Ahir Bhairav<\/td>\n<td>(alap)<\/td>\n<td>dawn<\/td>\n<td>ensemble<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Nat Bhairav<\/td>\n<td>Ektaal, 12<\/td>\n<td>early morning<\/td>\n<td>ensemble + tabla<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Piloo<\/td>\n<td>Teentaal, 16<\/td>\n<td>day<\/td>\n<td>ensemble + tabla<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Bhoop<\/td>\n<td>Jhaptaal, 10<\/td>\n<td>evening<\/td>\n<td>ensemble + tabla<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Des<\/td>\n<td>Dadra, 6<\/td>\n<td>night<\/td>\n<td>ensemble + tabla<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Pahadi<\/td>\n<td>Keherwa, 8<\/td>\n<td>(folk)<\/td>\n<td>ensemble + tabla<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Ghara – Dadra <em>(bonus)<\/em><\/td>\n<td>Dadra, 6<\/td>\n<td><\/td>\n<td>Kabra + tabla<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Bageshwari <em>(bonus)<\/em><\/td>\n<td><\/td>\n<td>late night<\/td>\n<td>Chaurasia + tabla<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Tracks 1 and 2 were a single movement on the original LP (\"Ahir Bhairav / Nat Bhairav\", 12:35). The original LP had\nonly tracks 1–6 and ran about 40 minutes. The 1995 EMI Hemisphere CD (CD EMC 3707) added three bonus pieces: Ghara–Dadra,\n<em>Dhun – Mishra Kirwani<\/em> (a santoor feature, 12:58) and Bageshwari. <strong>This Saregama download has no Dhun – Mishra Kirwani.<\/strong><\/p>\n<p>Per-track notes on each raga are embedded in each FLAC's <code>COMMENT<\/code> tag.<\/p>\n<h2>Reception and legacy<\/h2>\n<ul>\n<li>Widely called the best-selling Indian classical album ever, and a milestone in what was later called \"world music\".<\/li>\n<li>AllMusic gave it five stars. Ken Hunt wrote that if a newcomer buys only one Indian classical record, it should be this one.<\/li>\n<li>Listed in <em>1001 Albums You Must Hear Before You Die<\/em>.<\/li>\n<li>Admirers have included George Harrison and Paul McCartney, David Crosby and Roger McGuinn of the Byrds, and Bob Dylan.<\/li>\n<li>Around its 30th anniversary, the work was revisited in concert and released by Navras Records as the DVD set\n  <em>The Valley Recalls<\/em>. Kabra was too ill to perform, and Anindo Chatterjee played tabla. The Bhoop gat was expanded into a\n  90-minute jugalbandi.<\/li>\n<\/ul>\n<h2>About this archive copy<\/h2>\n<ul>\n<li>Source: Saregama WAV purchase, PCM 16-bit / 44.1 kHz stereo, converted losslessly to FLAC (level 8).\n  The decoded audio was checked bit-for-bit against the WAVs.<\/li>\n<li>Track titles and tala names follow the original Indian LP (ECSD 2382) as catalogued on MusicBrainz.<\/li>\n<li>Note: Bhoop runs 5:13 in this download, compared with about 6:15 on catalogued CD issues.<\/li>\n<li>Source-quality note: in the Saregama WAVs, <strong>Pahadi<\/strong> and <strong>Ghara – Dadra<\/strong> are dual-mono (left and right channels\n  identical) and nearly band-limited at about 8 kHz (content above 12 kHz sits at about −90 dB, against about −58 dB on Pilu).\n  The other tracks are true stereo with full bandwidth. These two look like a weaker transfer; consider replacing them\n  if a better master turns up.<\/li>\n<\/ul>\n<h3>Sources<\/h3>\n<ul>\n<li>Wikipedia: Call of the Valley; Shiv–Hari<\/li>\n<li>MusicBrainz release group 6329db5a-77c2-30b4-9fa0-aca1151f7e26 (LP ECSD.2382; Hemisphere CD EMC 3707)<\/li>\n<li>India Currents, \"A Classic Revived\"<\/li>\n<li>AllMusic review (Ken Hunt)<\/li>\n<li>Cover art: Cover Art Archive (Saregama reissue front, Hemisphere 1995 CD front)<\/li>\n<\/ul>", "dur": 3407, "durText": "56:47", "folder": null, "tracks": [{"n": 1, "title": "Ahir Bhairav", "raga": "Ahir Bhairav", "ragaBase": "Ahir Bhairav", "unconfirmed": false, "tala": "", "time": "Dawn", "times": ["Dawn"], "forms": [], "artists": ["Shivkumar Sharma", "Brij Bhushan Kabra", "Hariprasad Chaurasia"], "players": ["Shivkumar Sharma (santoor)", "Brij Bhushan Kabra (slide guitar)", "Hariprasad Chaurasia (bansuri)"], "instruments": ["bansuri", "santoor", "slide guitar"], "notes": "The suite opens at first light. Ahir Bhairav, a dawn raga, takes the flattened second (komal Re) of Bhairav and the flattened seventh (komal Ni) of Kafi. The result is grave but warm, and suits a shepherd waking in the valley. On the original LP this piece and Nat Bhairav formed one continuous first movement (12:35).", "bonus": false, "dur": 377, "durText": "6:17", "audio": null, "spotify": "6kIRhMJEuAKq4JsOKAMsnY"}, {"n": 2, "title": "Nat Bhairav – Ek Tala", "raga": "Nat Bhairav", "ragaBase": "Nat Bhairav", "unconfirmed": false, "tala": "Ektaal (12 beats)", "time": "Early morning", "times": ["Dawn"], "forms": [], "artists": ["Shivkumar Sharma", "Brij Bhushan Kabra", "Hariprasad Chaurasia", "Manikrao Popatkar"], "players": ["Shivkumar Sharma (santoor)", "Brij Bhushan Kabra (slide guitar)", "Hariprasad Chaurasia (bansuri)", "Manikrao Popatkar (tabla)"], "instruments": ["bansuri", "santoor", "slide guitar", "tabla"], "notes": "The second half of the dawn movement, where the tabla enters in 12-beat Ektaal. Nat Bhairav uses a natural second with a flattened sixth (komal Dha), the same scale as the Western harmonic major. It is brighter and more forward-moving than Ahir Bhairav, as if the day has begun.", "bonus": false, "dur": 384, "durText": "6:24", "audio": null, "spotify": "4KrXCZqKm2880zIi1ywvfU"}, {"n": 3, "title": "Piloo – Teen Tala", "raga": "Pilu", "ragaBase": "Pilu", "unconfirmed": false, "tala": "Teentaal (16 beats)", "time": "Late morning / day", "times": ["Morning", "Day"], "forms": [], "artists": ["Shivkumar Sharma", "Brij Bhushan Kabra", "Hariprasad Chaurasia", "Manikrao Popatkar"], "players": ["Shivkumar Sharma (santoor)", "Brij Bhushan Kabra (slide guitar)", "Hariprasad Chaurasia (bansuri)", "Manikrao Popatkar (tabla)"], "instruments": ["bansuri", "santoor", "slide guitar", "tabla"], "notes": "Pilu is a light-classical raga with folk roots and is famously flexible: it freely mixes natural and flattened forms of several notes. It is used widely for thumri and folk-flavoured pieces, and its playful, wistful character fits the herds moving out to graze.", "bonus": false, "dur": 471, "durText": "7:51", "audio": null, "spotify": "21T2zIfPMvmVHUqpBY2YIi"}, {"n": 4, "title": "Bhoop – Jhap Tala", "raga": "Bhoop (Bhupali)", "ragaBase": "Bhoop", "unconfirmed": false, "tala": "Jhaptaal (10 beats)", "time": "Evening (first quarter of the night)", "times": ["Evening", "Night"], "forms": [], "artists": ["Hariprasad Chaurasia", "Brij Bhushan Kabra", "Shivkumar Sharma", "Manikrao Popatkar"], "players": ["Hariprasad Chaurasia (bansuri)", "Brij Bhushan Kabra (slide guitar)", "Shivkumar Sharma (santoor)", "Manikrao Popatkar (tabla)"], "instruments": ["bansuri", "santoor", "slide guitar", "tabla"], "notes": "Bhoop is pentatonic (Sa Re Ga Pa Dha), close to the major pentatonic of folk music everywhere, which helps explain why Western listeners took to the album. It is set in 10-beat Jhaptaal (2+3+2+3). The 1997 Navras concert DVD 'The Valley Recalls' expanded this Bhoop gat into a 90-minute jugalbandi. Note: this Saregama file runs 5:13, while catalogued CD issues list Bhoop at about 6:15.", "bonus": false, "dur": 313, "durText": "5:13", "audio": null, "spotify": "2cp93CtKRe5LKpD9GsmUpK"}, {"n": 5, "title": "Des – Dadra Tala", "raga": "Des (Desh)", "ragaBase": "Des", "unconfirmed": false, "tala": "Dadra (6 beats)", "time": "Night", "times": ["Night"], "forms": ["Dadra"], "artists": ["Shivkumar Sharma", "Brij Bhushan Kabra", "Hariprasad Chaurasia", "Manikrao Popatkar"], "players": ["Shivkumar Sharma (santoor)", "Brij Bhushan Kabra (slide guitar)", "Hariprasad Chaurasia (bansuri)", "Manikrao Popatkar (tabla)"], "instruments": ["bansuri", "santoor", "slide guitar", "tabla"], "notes": "Des is a night raga from the Khamaj family. It is associated with the monsoon and with yearning, and is familiar across India through 'Vande Mataram'. Here it is set in a lilting 6-beat Dadra.", "bonus": false, "dur": 362, "durText": "6:02", "audio": null, "spotify": "2g5NDr7oa36wR84micoVsP"}, {"n": 6, "title": "Pahadi – Kehrawa Tala", "raga": "Pahadi", "ragaBase": "Pahadi", "unconfirmed": false, "tala": "Keh osity and Aman Ali Khan's merukhand system of permutation-based note patterns, and the result was something new:\nan <em>ati-vilambit<\/em> (extremely slow) khayal, often in Jhumra, that unfolds note by note, closer to meditation than display.\nHe brought <strong>tarana<\/strong> back as a serious form, linking its syllables to Persian and Sufi meanings,\nand took Carnatic ragas such as <strong>Charukeshi<\/strong> into khayal. Film audiences know his voice from\n<em>Baiju Bawra<\/em> (1952) and <em>Jhanak Jhanak Payal Baaje<\/em> (1955). He died in a car accident in Calcutta in 1974.<\/p>\n<h2>About the album<\/h2>\n<p>This is a Saregama compilation of long-form performances (10–30 minutes each), most in his signature slow-to-fast structure.\nIt includes one of his own ragas, <strong>Chandramadhu<\/strong>, and two of his best-loved ragas, <strong>Darbari<\/strong> and <strong>Miyan Malhar<\/strong>.<\/p>\n<h2>Track notes<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Bandish<\/th>\n<th>Raga<\/th>\n<th>Tala<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Karam Karo + Tarana<\/td>\n<td>Shuddha Kalyan<\/td>\n<td>Jhumra<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Begun Kaamna Jaage<\/td>\n<td>Bageshri? (unconfirmed)<\/td>\n<td>Jhumra<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Man Sumarat Nis Din<\/td>\n<td>Bairagi<\/td>\n<td>Teentaal<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Laaj Rakho Tum Mori Gusaiyan<\/td>\n<td>Charukeshi<\/td>\n<td>Teentaal<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Chin Chin Baat Takat Hun Tori<\/td>\n<td><em>unidentified<\/em><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Bairan Bhai Rain<\/td>\n<td>Chandramadhu (his own raga)<\/td>\n<td>Jhumra/Teentaal<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Karim Naam Tero<\/td>\n<td>Miyan Malhar<\/td>\n<td>Jhumra<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Barasan Lagi Re Badariya<\/td>\n<td>Miyan Malhar<\/td>\n<td>Teentaal<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>O Balma / Sajan More Ghar Aye<\/td>\n<td>Jog<\/td>\n<td>Rupak → Teentaal<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Mori Ali Ri / Kin Bairan Kaan Bhare<\/td>\n<td>Darbari Kanada<\/td>\n<td>Jhaptaal → drut<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Chhai Badara Kaari<\/td>\n<td>? (Malhar family?)<\/td>\n<td>⚠ credited to <strong>Faiyaz Khan<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Raga attributions come from the bandish index at <em>amirkhanikhayal<\/em> (sites.google.com/site/amirkhanikhayal) unless marked.<\/p>\n<h2>To do<\/h2>\n<ul>\n<li>Confirm the raga for tracks 2 and 5, and check by ear whether track 11 is Faiyaz Khan or Amir Khan.<\/li>\n<\/ul>\n<h2>About this archive copy<\/h2>\n<ul>\n<li>Source: Saregama HD WAV (16-bit / 44.1 kHz), converted losslessly to FLAC. The decoded audio was checked bit-for-bit against the WAVs.<\/li>\n<li>Track order follows the Saregama album page (album id 55804).<\/li>\n<li>All tracks are stereo, but most roll off around 11–13 kHz: old tape or broadcast sources, with no MP3 brick wall.<\/li>\n<\/ul>", "dur": 13028, "durText": "3:37:08", "folder": null, "tracks": [{"n": 1, "title": "Karam Karo – Khayal, Tarana", "raga": "Shuddha Kalyan", "ragaBase": "Shuddha Kalyan", "unconfirmed": false, "tala": "Jhumra (vilambit)", "time": "Evening", "times": ["Evening"], "forms": ["Khayal", "Tarana"], "artists": ["Ustad Amir Khan"], "players": ["Ustad Amir Khan (vocals)"], "instruments": ["vocals"], "notes": "Vilambit khayal 'Karam karo' in Shuddha Kalyan, set in Jhumra, followed by a tarana. Amir Khan's ati-vilambit (extremely slow) Jhumra was central to his style, and he championed the tarana, linking its syllables to Persian and Sufi meanings. Raga per the amirkhanikhayal bandish index.", "bonus": false, "dur": 1775, "durText": "29:35", "audio": null, "spotify": "5NDQRYBzcBRSzj0POPkngI"}, {"n": 2, "title": "Begun Kaamna Jaage – Khayal", "raga": "Bageshri (unconfirmed)", "ragaBase": "Bageshri", "unconfirmed": true, "tala": "Jhumra (vilambit)", "time": "Late night", "times": ["Night"], "forms": ["Khayal"], "artists": ["Ustad Amir Khan"], "players": ["Ustad Amir Khan (vocals)"], "instruments": ["vocals"], "notes": "Vilambit khayal. The amirkhanikhayal index lists a Jhumra vilambit in Bageshri that is probably this bandish, but the match is not certain; confirm by ear. Bageshri is a late-night Kafi-family raga of longing.", "bonus": false, "dur": 1750, "durText": "29:10", "audio": null, "spotify": "2D3Mpp6Rpjzib2meFNxmYR"}, {"n": 3, "title": "Man Sumarat Nis Din Tumharo Naam – Khayal", "raga": "Bairagi", "ragaBase": "Bairagi", "unconfirmed": false, "tala": "Teentaal (chhota khayal)", "time": "Early morning", "times": ["Dawn"], "forms": ["Khayal"], "artists": ["Ustad Amir Khan"], "players": ["Ustad Amir Khan (vocals)"], "instruments": ["vocals"], "notes": "Chhota khayal in Bairagi (Bairagi Bhairav), a pentatonic early-morning raga (Sa, komal Re, Ma, Pa, komal Ni) of ascetic calm. The text, 'my mind remembers your name night and day', suits it.", "bonus": false, "dur": 647, "durText": "10:47", "audio": null, "spotify": "2v51WyWUYuVh2qnRuItBMk"}, {"n": 4, "title": "Laaj Rakho Tum Mori Gusaiyan – Khayal", "raga": "Charukeshi", "ragaBase": "Charukeshi", "unconfirmed": false, "tala": "Teentaal (chhota khayal)", "time": "", "times": [], "forms": ["Khayal"], "artists": ["Ustad Amir Khan"], "players": ["Ustad Amir Khan (vocals)"], "instruments": ["vocals"], "notes": "Chhota khayal in Charukeshi, a Carnatic raga (natural Re, Ga, Ma, Pa with flat Dha and Ni) that Amir Khan was among the first to bring into Hindustani khayal. He was keen on such cross-pollination.", "bonus": false, "dur": 931, "durText": "15:31", "audio": null, "spotify": "1za56iclpjgqvkZ48qOoU2"}, {"n": 5, "title": "Chin Chin Baat Takat Hun Tori – Khayal", "raga": "", "ragaBase": "", "unconfirmed": false, "tala": "", "time": "", "times": [], "forms": ["Khayal"], "artists": ["Ustad Amir Khan"], "players": ["Ustad Amir Khan (vocals)"], "instruments": ["vocals"], "notes": "Khayal 'Chin chin baat takat hun tori'     return `<details class="facet" ${open ? "open" : ""}><summary>${esc(f.label)}</summary><ul>` +
      shown.map(v => `<li><button data-facet="${f.key}" data-val="${esc(v)}" aria-pressed="${sel === v}" ${!counts.get(v) && sel !== v ? "disabled" : ""}>
        <span>${esc(v)}</span><span class="ct">${counts.get(v) || 0}</span></button></li>`).join("") +
      `</ul>${vals.length > LIMIT ? `<button class="more" data-more="${f.key}">${expanded ? "Show fewer" : `Show all ${vals.length}`}</button>` : ""}</details>`;
  }).join("");
  $("#facets").innerHTML = html;
}
const facetExpanded = new Set();

function renderActive() {
  const chips = [];
  if (S.q) chips.push(`<span class="chip on">“${esc(S.q)}” <button data-clear="q" aria-label="Clear search">×</button></span>`);
  for (const f of FACETS) if (S.f[f.key]) chips.push(`<span class="chip on">${esc(f.label)}: ${esc(S.f[f.key])} <button data-clear="${f.key}" aria-label="Remove filter">×</button></span>`);
  if (chips.length > 1) chips.push(`<button class="linkish" data-clear="all">Clear all</button>`);
  $("#active").innerHTML = chips.join("");
}

function pageSlice(list, size) {
  const pages = Math.max(1, Math.ceil(list.length / size));
  if (S.page > pages) S.page = pages;
  return { items: list.slice((S.page - 1) * size, S.page * size), pages };
}
function renderPager(pages) {
  if (pages <= 1) { $("#pager").innerHTML = ""; return; }
  const p = S.page, btns = [];
  btns.push(`<button data-page="${p - 1}" ${p === 1 ? "disabled" : ""} aria-label="Previous page">‹</button>`);
  const nums = new Set([1, pages, p - 1, p, p + 1].filter(n => n >= 1 && n <= pages));
  let last = 0;
  for (const n of [...nums].sort((a, b) => a - b)) {
    if (n - last > 1) btns.push(`<span aria-hidden="true">…</span>`);
    btns.push(`<button data-page="${n}" ${n === p ? 'aria-current="page"' : ""}>${n}</button>`);
    last = n;
  }
  btns.push(`<button data-page="${p + 1}" ${p === pages ? "disabled" : ""} aria-label="Next page">›</button>`);
  $("#pager").innerHTML = btns.join("");
}

const PLAY_ICON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>`;
const CHEV = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`;
const SP = (kind, id) => `https://open.spotify.com/${kind}/${id}`;
// local file if we have it, else the Spotify embed
const playBtn = t => t.audio ? `<button class="play" data-play="${t.uid}" aria-label="Play ${esc(t.title)}">${PLAY_ICON}</button>`
  : t.spotify ? `<button class="play" data-spplay="${t.uid}" aria-label="Play ${esc(t.title)} on Spotify" title="Play on Spotify">${PLAY_ICON}</button>` : "";
const spLink = t => t.spotify ? `<a class="splink" href="${SP("track", t.spotify)}" target="_blank" rel="noopener" title="Open in Spotify">Spotify ↗</a>` : "";
function ragaTag(t) {
  if (!t.raga) return "";
  return `<button class="tag raga" data-facet="raga" data-val="${esc(t.ragaBase)}" title="Filter by raga">${esc(t.ragaBase)}</button>` +
    (t.unconfirmed ? `<span class="tag warn" title="${esc(t.raga)}">unconfirmed</span>` : "");
}

function renderAlbums(tracks) {
  const byAlbum = new Map();
  tracks.forEach(t => byAlbum.set(t.album.id, (byAlbum.get(t.album.id) || 0) + 1));
  let list = ALBUMS.filter(a => byAlbum.has(a.id));
  const s = S.sort || "title";
  const cmp = { title: (a, b) => a.title.localeCompare(b.title), artist: (a, b) => a.artist.localeCompare(b.artist),
    year: (a, b) => (a.year || "9999").localeCompare(b.year || "9999"), dur: (a, b) => b.dur - a.dur, count: (a, b) => b.tracks.length - a.tracks.length }[s];
  // arrange by genre: biggest genre first, then the chosen sort inside each genre
  const gCount = new Map();
  list.forEach(a => gCount.set(a.genre, (gCount.get(a.genre) || 0) + 1));
  const gOrder = g => [-gCount.get(g), g];
  list.sort((a, b) => {
    const [ca, na] = gOrder(a.genre), [cb, nb] = gOrder(b.genre);
    return ca - cb || na.localeCompare(nb) || cmp(a, b);
  });
  const { items, pages } = pageSlice(list, ALBUM_PAGE);
  const nG = gCount.size;
  $("#meta").textContent = `${list.length} album${list.length === 1 ? "" : "s"}` + (nG > 1 ? ` in ${nG} genres` : "") + (anyFilter() ? ` · ${tracks.length} matching tracks` : "");
  if (!items.length) { $("#results").innerHTML = `<div class="empty">No albums match. Try fewer filters.</div>`; renderPager(pages); return; }
  const groups = [];
  for (const a of items) {
    if (!groups.length || groups.at(-1).genre !== a.genre) groups.push({ genre: a.genre, albums: [] });
    groups.at(-1).albums.push(a);
  }
  $("#results").innerHTML = groups.map(g => `
    <section class="genre-group">
      <h2 class="genre-h"><button class="genre-link" data-facet="genre" data-val="${esc(g.genre)}" title="Show only ${esc(g.genre)}">${esc(g.genre)}</button>
        <span>${gCount.get(g.genre)} album${gCount.get(g.genre) === 1 ? "" : "s"}</span></h2>
      <div class="grid">` + g.albums.map(a => `
    <button class="card" data-open="${a.id}">
      ${coverImg(a.thumb, "", a.title)}
      <div class="body">
        <span class="t">${esc(a.title)}</span>
        <span class="a">${esc(a.artist)}</span>
        <span class="m">${[a.year, a.type, `${a.tracks.length} tracks`, fmt(a.dur)].filter(Boolean).map(esc).join(" · ")}</span>
        ${anyFilter() && byAlbum.get(a.id) !== a.tracks.length ? `<span class="match">${byAlbum.get(a.id)} matching track${byAlbum.get(a.id) === 1 ? "" : "s"}</span>` : ""}
      </div>
    </button>`).join("") + `</div></section>`).join("");
  renderPager(pages);
}
function coverImg(src, cls, title) {
  if (src) return `<img ${cls ? `class="${cls}"` : ""} src="${src}" alt="" loading="lazy">`;
  const initials = (title || "♪").split(/\s+/).filter(w => /\w/.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "♪";
  return `<div class="ph ${cls}" aria-hidden="true">${esc(initials)}</div>`;
}

const expandedTracks = new Set();
function renderTracks(tracks) {
  const s = S.sort || "album";
  const list = [...tracks];
  if (s === "title") list.sort((a, b) => a.title.localeCompare(b.title));
  if (s === "raga") list.sort((a, b) => (a.ragaBase || "~").localeCompare(b.ragaBase || "~"));
  if (s === "dur") list.sort((a, b) => b.dur - a.dur);
  if (s === "short") list.sort((a, b) => a.dur - b.dur);
  const { items, pages } = pageSlice(list, TRACK_PAGE);
  $("#meta").textContent = `${list.length} track${list.length === 1 ? "" : "s"} · ${fmt(list.reduce((n, t) => n + t.dur, 0))}`;
  $("#results").innerHTML = items.length ? `<ul class="tracks">` + items.map(t => {
    const open = expandedTracks.has(t.uid);
    return `<li>
      <div class="trow">
        ${coverImg(t.album.thumb, "", t.album.title)}
        <div class="main">
          <div class="tt">${esc(t.title)}${t.bonus ? ' <span class="tag">bonus</span>' : ""}</div>
          <div class="sub">${esc(t.artists.join(", ") || t.album.artist)} · <a href="#album=${t.album.id}" data-open="${t.album.id}">${esc(t.album.title)}</a></div>
          <div class="tags">${ragaTag(t)}${t.tala ? `<span class="tag">${esc(t.tala)}</span>` : ""}${t.time ? `<span class="tag">${esc(t.time)}</span>` : ""}</div>
        </div>
        <div class="right">${spLink(t)}<span>${esc(t.durText)}</span>${playBtn(t)}
          <button class="expand" data-expand="${t.uid}" aria-expanded="${open}" aria-label="Show notes">${CHEV}</button></div>
      </div>
      ${open ? trackNotes(t) : ""}
    </li>`;
  }).join("") + `</ul>` : `<div class="empty">No tracks match. Try fewer filters.</div>`;
  renderPager(pages);
}
function trackNotes(t) {
  const rows = [["Raga", t.raga], ["Tala", t.tala], ["Time", t.time], ["Performers", t.players.join(", ")], ["Album", `${t.album.title}, track ${t.n}`]]
    .filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  return `<div class="tnotes">${t.notes ? `<div>${esc(t.notes)}</div>` : ""}<dl>${rows}</dl></div>`;
}

function render() {
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view));
  $("#sort").innerHTML = SORTS[S.view].map(([v, l]) => `<option value="${v}">Sort: ${l}</option>`).join("");
  $("#sort").value = S.sort && SORTS[S.view].some(x => x[0] === S.sort) ? S.sort : SORTS[S.view][0][0];
  if ($("#q").value !== S.q) $("#q").value = S.q;
  const tracks = filteredTracks();
  renderFacets(); renderActive();
  S.view === "albums" ? renderAlbums(tracks) : renderTracks(tracks);
  syncDialog();
  markPlaying();
}

// ---------- album dialog ----------
const dlg = $("#dlg");
function syncDialog() {
  const a = ALBUMS.find(x => x.id === S.open);
  if (!a) { if (dlg.open) dlg.close(); return; }
  if (dlg.dataset.album !== a.id) {
    dlg.dataset.album = a.id;
    $("#dlgBody").innerHTML = albumDetail(a);
    dlg.scrollTop = 0;
  }
  if (!dlg.open) dlg.showModal();
}
function albumDetail(a) {
  const meta = [["Year", a.year], ["Performers", a.performers.join(", ")], ["Gharana", a.gharana], ["Genre", a.genre], ["Style", a.styles.join(", ")],
    ["Original label", a.originalLabel], ["Catalog", a.catalog], ["Label", a.label], ["Length", `${a.tracks.length} tracks · ${fmt(a.dur)}`],
    ["Source", a.source], ["Folder", a.folder]].filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  const links = [
    a.tracks.some(t => t.audio) ? `<button class="btn primary" data-playalbum="${a.id}">${PLAY_ICON} Play album</button>` : "",
    !a.tracks.some(t => t.audio) && a.spotify ? `<button class="btn primary" data-spalbum="${a.id}">${PLAY_ICON} Play on Spotify</button>` : "",
    a.spotify ? `<a class="btn spotify" href="${SP("album", a.spotify)}" target="_blank" rel="noopener">Spotify ↗</a>` : "",
    a.saregama ? `<a class="btn" href="${a.saregama}" target="_blank" rel="noopener">Saregama ↗</a>` : "",
    a.musicbrainz ? `<a class="btn" href="${a.musicbrainz}" target="_blank" rel="noopener">MusicBrainz ↗</a>` : "",
  ].join("");
  return `<div class="detail">
    <div class="hero">
      <div>${a.cover ? `<img class="cover" src="${a.cover}" alt="Cover of ${esc(a.title)}">` : coverImg(null, "cover", a.title)}
        ${a.extras.length ? `<div class="extras">${a.extras.map(x => `<a href="${x.src}" target="_blank"><img src="${x.src}" alt=""><span>${esc(x.label)}</span></a>`).join("")}</div>` : ""}</div>
      <div>
        <h2>${esc(a.title)}</h2>
        <div class="by">${esc(a.artist)}</div>
        <dl class="meta">${meta}</dl>
        <div class="actions">${links}</div>
      </div>
    </div>
    <h3>Tracks</h3>
    <ol class="dtracks">${a.tracks.map(t => `<li>
      <span class="num">${t.n}</span>
      <div><div class="tt">${esc(t.title)}${t.bonus ? ' <span class="tag">bonus</span>' : ""}</div>
        <div class="tags">${ragaTag(t)}${t.tala ? `<span class="tag">${esc(t.tala)}</span>` : ""}${t.time ? `<span class="tag">${esc(t.time)}</span>` : ""}</div>
        ${t.notes ? `<div class="tn">${esc(t.notes)}</div>` : ""}</div>
      <div class="dur">${spLink(t)}${esc(t.durText)}${playBtn(t)}</div></li>`).join("")}</ol>
    ${a.notesHtml ? `<h3>Liner notes</h3><div class="liner">${a.notesHtml}</div>` : ""}
  </div>`;
}
dlg.addEventListener("close", () => { if (S.open) set({ open: "" }, { keepPage: true }); });
$("#dlgClose").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

// ---------- player ----------
const audio = $("#audio");
let queue = [], qi = -1;
function playerMode(sp) {
  $("#spEmbed").hidden = !sp; audio.hidden = sp; $("#prevBtn").hidden = sp; $("#nextBtn").hidden = sp;
  $("#npCover").hidden = sp; document.querySelector(".player .np").hidden = sp;
  document.body.classList.toggle("sp-mode", sp);
  if (sp) audio.pause(); else $("#spEmbed").src = "about:blank";
}
function spPlay(kind, id) {
  playerMode(true);
  $("#spEmbed").src = `https://open.spotify.com/embed/${kind}/${id}?utm_source=generator`;
  $("#player").hidden = false; document.body.classList.add("has-player");
}
$("#closePlayer").onclick = () => { audio.pause(); $("#spEmbed").src = "about:blank"; $("#player").hidden = true; document.body.classList.remove("has-player", "sp-mode"); };
function playQueue(list, i) {
  playerMode(false);
  queue = list.filter(t => t.audio); qi = i;
  const t = queue[qi]; if (!t) return;
  audio.src = t.audio.split("/").map(encodeURIComponent).join("/");
  audio.play().catch(() => {});
  $("#player").hidden = false; document.body.classList.add("has-player");
  $("#npCover").src = t.album.thumb || ""; $("#npCover").style.visibility = t.album.thumb ? "" : "hidden"; $("#npTitle").textContent = t.title;
  $("#npSub").textContent = [t.ragaBase, t.album.artist].filter(Boolean).join(" · ");
  document.title = `▶ ${t.title} — ${DATA.title}`;
  markPlaying();
}
function markPlaying() {
  const cur = queue[qi];
  document.querySelectorAll("[data-play]").forEach(b => b.classList.toggle("playing", !!cur && b.dataset.play === cur.uid && !audio.paused));
}
audio.addEventListener("ended", () => { if (qi + 1 < queue.length) playQueue(queue, qi + 1); else markPlaying(); });
audio.addEventListener("play", markPlaying); audio.addEventListener("pause", markPlaying);
$("#prevBtn").onclick = () => qi > 0 && playQueue(queue, qi - 1);
$("#nextBtn").onclick = () => qi + 1 < queue.length && playQueue(queue, qi + 1);

// ---------- events ----------
document.addEventListener("click", e => {
  const el = e.target.closest("button, a[data-open]");
  if (!el) return;
  const d = el.dataset;
  if (d.view) set({ view: d.view, sort: "" });
  else if (d.facet) {
    e.stopPropagation();
    const f = { ...S.f }; f[d.facet] === d.val ? delete f[d.facet] : (f[d.facet] = d.val);
    set({ f, open: "" });
  }
  else if (d.more) { facetExpanded.has(d.more) ? facetExpanded.delete(d.more) : facetExpanded.add(d.more); renderFacets(); }
  else if (d.clear) {
    if (d.clear === "all") set({ q: "", f: {} });
    else if (d.clear === "q") set({ q: "" });
    else { const f = { ...S.f }; delete f[d.clear]; set({ f }); }
  }
  else if (d.page) { set({ page: +d.page }); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (d.open) { e.preventDefault(); set({ open: d.open }, { keepPage: true }); }
  else if (d.expand) { expandedTracks.has(d.expand) ? expandedTracks.delete(d.expand) : expandedTracks.add(d.expand); render(); }
  else if (d.play) {
    const cur = queue[qi];
    if (cur && cur.uid === d.play) { audio.paused ? audio.play() : audio.pause(); return; }
    const t = TRACKS.find(x => x.uid === d.play);
    const ctx = S.open ? t.album.tracks : (S.view === "tracks" ? filteredTracks() : t.album.tracks);
    const list = ctx.filter(x => x.audio);
    playQueue(list, list.indexOf(t));
  }
  else if (d.spplay) { const t = TRACKS.find(x => x.uid === d.spplay); spPlay("track", t.spotify); }
  else if (d.spalbum) { const a = ALBUMS.find(x => x.id === d.spalbum); spPlay("album", a.spotify); }
  else if (d.playalbum) { const a = ALBUMS.find(x => x.id === d.playalbum); playQueue(a.tracks, 0); }
});
let qTimer;
$("#q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => set({ q: e.target.value.trim() }, { replace: true }), 180); });
$("#sort").addEventListener("change", e => set({ sort: e.target.value }));
$("#filterToggle").onclick = e => { const o = $("#facets").classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q") && !dlg.open) { e.preventDefault(); $("#q").focus(); }
});
window.addEventListener("popstate", () => { readHash(); render(); });
window.addEventListener("hashchange", () => { readHash(); render(); });

// theme toggle (remembered per browser)
const themeKey = "catalog-theme";
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem(themeKey)); } catch {}
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark"; applyTheme(next);
  try { localStorage.setItem(themeKey, next); } catch {}
};

readHash(); render();
</script>
</body>
</html>
